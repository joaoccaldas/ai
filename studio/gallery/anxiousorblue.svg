<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Anxious or Blue immersive concept</title>
  <desc id="desc">A calm therapy concept artwork in mist blue, sage and warm cream.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7e9e9"/>
      <stop offset="0.52" stop-color="#f4f4ec"/>
      <stop offset="1" stop-color="#ead9c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#9ab5aa" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <circle cx="90" cy="930" r="250" fill="#9ab5aa" opacity="0.22" filter="url(#soft)"/>
  <circle cx="810" cy="220" r="230" fill="#efd1a5" opacity="0.28" filter="url(#soft)"/>
  <ellipse cx="450" cy="560" rx="290" ry="390" fill="url(#glow)" stroke="#6f8c81" stroke-opacity="0.28" stroke-width="2"/>
  <ellipse cx="450" cy="560" rx="325" ry="425" fill="none" stroke="#6f8c81" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="238" cy="262" r="14" fill="#edc98f"/>
  <circle cx="238" cy="262" r="32" fill="none" stroke="#edc98f" stroke-opacity="0.38"/>
  <g fill="#263a34" text-anchor="middle">
    <text x="450" y="465" font-family="Georgia, serif" font-size="74" letter-spacing="-2">Feeling</text>
    <text x="450" y="548" font-family="Georgia, serif" font-size="78" font-style="italic" fill="#6a897d">down,</text>
    <text x="450" y="635" font-family="Georgia, serif" font-size="68">stressed or</text>
    <text x="450" y="718" font-family="Georgia, serif" font-size="68">out of touch?</text>
  </g>
  <text x="450" y="112" fill="#617c73" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" letter-spacing="7">ANXIOUS OR BLUE</text>
  <text x="450" y="1080" fill="#617c73" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" letter-spacing="5">THERAPY · STOCKHOLM · ONLINE</text>
  <path d="M360 1012 C410 980 490 980 540 1012" fill="none" stroke="#6f8c81" stroke-opacity="0.45" stroke-width="2"/>
</svg>