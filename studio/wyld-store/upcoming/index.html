<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://ridewyld.com; form-action https://ridewyld.com; base-uri 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#cbb8f5">
<title>Upcoming releases — WYLD</title>
<meta name="description" content="New WYLD kit is on the way. Random drops, bold colour and good vibes — leave your email and we'll let you know first.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WYLD">
<meta property="og:title" content="Upcoming releases — WYLD">
<meta property="og:description" content="New WYLD kit is on the way. Leave your email and we'll let you know first.">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../fonts/fun.css">
<link rel="icon" href="../app/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../app/icons/apple-touch-icon.png">
<style>
:root{--lilac:#cbb8f5;--butter:#f8ecb0;--pink:#ff5fa2;--pink-2:#ff8cc0;--ink:#241a33;--cell:clamp(56px,9vw,96px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--butter);color:var(--ink);font:500 18px/1.4 Caveat,'Bradley Hand',cursive;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}

/* wavy checkerboard: a plain CSS checker, bent by an SVG wave filter */
.checker{position:fixed;inset:-12%;z-index:-1;background:conic-gradient(var(--lilac) 25%,var(--butter) 0 50%,var(--lilac) 0 75%,var(--butter) 0) 0 0/calc(var(--cell) * 2) calc(var(--cell) * 2);filter:url(#wave)}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(18px + env(safe-area-inset-top)) clamp(18px,5vw,56px) 0}
.brand img{height:24px;width:auto;display:block}
.top nav{display:flex;gap:clamp(12px,3vw,32px);font:700 20px/1 Caveat,cursive}
.top nav a{text-decoration:none;padding:6px 2px}
.top nav a[aria-current]{background:linear-gradient(transparent 70%,var(--pink-2) 0) no-repeat}

main{position:relative;min-height:calc(100vh - 70px);min-height:calc(100svh - 70px);display:grid;place-items:center;text-align:center;padding:40px 18px 80px}
.hero{position:relative;z-index:1;max-width:900px}
h1{margin:0;font:400 clamp(64px,15vw,168px)/.9 Chewy,'Arial Rounded MT Bold',system-ui,sans-serif;color:var(--pink);letter-spacing:.01em;
  -webkit-text-stroke:clamp(3px,.6vw,6px) var(--ink);paint-order:stroke fill;
  text-shadow:0 .06em 0 var(--ink),0 .11em 0 rgba(36,26,51,.18)}
h1 span{display:block}
.lede{margin:18px 0 0;font:700 clamp(26px,4.4vw,40px)/1.2 Caveat,cursive;display:inline-block;background:linear-gradient(transparent 82%,var(--pink-2) 0) no-repeat}

form{margin:34px auto 0;max-width:560px;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 18px;background:#fffafc;border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 5px 0 var(--ink)}
form svg{flex:none;width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8}
input{flex:1;min-width:0;border:0;background:transparent;font:600 21px Caveat,cursive;color:var(--ink);outline:none;padding:10px 4px}
input::placeholder{color:#8b7f99}
button{flex:none;border:0;border-radius:999px;background:var(--pink);color:#fff;font:700 13px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:16px 22px;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.small{margin-top:14px;font-size:21px}
.back{display:inline-block;margin-top:22px;font:700 22px Caveat,cursive}

/* stickers */
.s{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(36,26,51,.18))}
.s svg{display:block;width:100%;height:100%}
.note{position:absolute;font:700 clamp(20px,2.4vw,28px)/1.05 Caveat,cursive;transform:rotate(-8deg);white-space:pre-line}
.badge{position:absolute;padding:8px 14px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;font:400 clamp(18px,2.4vw,26px)/1 Chewy,sans-serif;color:var(--pink);box-shadow:0 4px 0 var(--ink);transform:rotate(9deg)}
.peek{position:relative;z-index:1;padding:10px 18px 90px;text-align:center}
.peek h2{margin:0 0 8px;font:400 clamp(40px,7vw,72px)/1 Chewy,sans-serif;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.peek > p{margin:0 0 30px;font:700 clamp(22px,3vw,30px)/1.2 Caveat,cursive}
.peek-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:clamp(18px,4vw,44px)}
.peek figure{margin:0;background:#fff;border:2.5px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:16px 16px 10px}
.peek figure:nth-child(1){transform:rotate(-3deg);width:min(78vw,380px)}
.peek figure:nth-child(2){transform:rotate(4deg);width:min(40vw,170px)}
.peek img{display:block;width:100%;height:auto}
.peek figcaption{margin-top:8px;font:700 22px/1.1 Caveat,cursive}
@media (prefers-reduced-motion:no-preference){.float{animation:float 5s ease-in-out infinite}.float.b{animation-duration:6.5s;animation-delay:-2s}}
@keyframes float{50%{translate:0 -10px}}
@media (max-width:620px){.hide-sm{display:none}form{flex-wrap:wrap;border-radius:26px;padding:10px}form button{width:100%}}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <filter id="wave" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.006" numOctaves="1" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <symbol id="star" viewBox="0 0 64 64"><path d="M32 4l8.2 17.6L59 24l-14 13 3.8 19L32 46.6 15.2 56 19 37 5 24l18.8-2.4z" fill="#ffd84a" stroke="#241a33" stroke-width="3.5" stroke-linejoin="round"/></symbol>
  <symbol id="heart" viewBox="0 0 64 64"><path d="M32 56S6 40 6 22A13 13 0 0 1 32 16a13 13 0 0 1 26 6c0 18-26 34-26 34z" fill="#ff5fa2" stroke="#241a33" stroke-width="3.5" stroke-linejoin="round"/></symbol>
  <symbol id="smile" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="#ffe14d" stroke="#241a33" stroke-width="3.5"/><circle cx="23" cy="26" r="3.6" fill="#241a33"/><circle cx="41" cy="26" r="3.6" fill="#241a33"/><path d="M19 37c7 10 19 10 26 0" fill="none" stroke="#241a33" stroke-width="3.5" stroke-linecap="round"/></symbol>
  <symbol id="flower" viewBox="0 0 64 64"><g fill="#ff8cc0" stroke="#241a33" stroke-width="3"><circle cx="32" cy="14" r="11"/><circle cx="50" cy="28" r="11"/><circle cx="43" cy="49" r="11"/><circle cx="21" cy="49" r="11"/><circle cx="14" cy="28" r="11"/></g><circle cx="32" cy="33" r="9" fill="#ffe14d" stroke="#241a33" stroke-width="3"/></symbol>
  <symbol id="sparkle" viewBox="0 0 64 64"><path d="M32 4c3 17 11 25 28 28-17 3-25 11-28 28-3-17-11-25-28-28C21 29 29 21 32 4z" fill="#fff" stroke="#241a33" stroke-width="3" stroke-linejoin="round"/></symbol>
  <symbol id="mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
</svg>
<div class="checker" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="../" aria-label="WYLD home"><img src="https://ridewyld.com/cdn/shop/files/WYLD-Black1080.png?width=240" alt="WYLD" width="68" height="24"></a>
  <nav aria-label="Main">
    <a href="../">Shop</a>
    <a href="./" aria-current="page">Upcoming</a>
    <a href="../#custom">Custom</a>
  </nav>
</header>

<main>
  <!-- stickers (decorative) -->
  <span class="s float" style="width:78px;height:78px;top:4%;left:8%" aria-hidden="true"><svg><use href="#star"/></svg></span>
  <span class="s float b" style="width:88px;height:88px;bottom:20%;left:12%" aria-hidden="true"><svg><use href="#smile"/></svg></span>
  <span class="s" style="width:54px;height:54px;top:9%;right:22%" aria-hidden="true"><svg><use href="#heart"/></svg></span>
  <span class="s float hide-sm" style="width:80px;height:80px;top:52%;right:7%" aria-hidden="true"><svg><use href="#flower"/></svg></span>
  <span class="s hide-sm" style="width:44px;height:44px;top:52%;left:7%" aria-hidden="true"><svg><use href="#sparkle"/></svg></span>
  <span class="s float b hide-sm" style="width:50px;height:50px;bottom:12%;left:30%" aria-hidden="true"><svg><use href="#star"/></svg></span>
  <span class="s hide-sm" style="width:40px;height:40px;bottom:20%;right:28%" aria-hidden="true"><svg><use href="#sparkle"/></svg></span>
  <span class="s" style="width:58px;height:58px;bottom:6%;right:9%" aria-hidden="true"><svg><use href="#heart"/></svg></span>
  <span class="badge hide-sm" style="top:30%;right:9%" aria-hidden="true">GOOD<br>VIBES</span>
  <span class="note hide-sm" style="top:24%;left:4%" aria-hidden="true">random
drops ★</span>
  <span class="note hide-sm" style="bottom:9%;left:6%;transform:rotate(-12deg)" aria-hidden="true">let's ride
wyld ♡</span>
  <span class="note hide-sm" style="top:10%;right:4%;transform:rotate(9deg)" aria-hidden="true">same kit,
new colour</span>

  <div class="hero">
    <h1><span>Upcoming</span><span>Releases</span></h1>
    <p class="lede">New kit is on the way ♡</p>

    <form action="https://ridewyld.com/contact#contact_form" method="post" target="_blank">
      <input type="hidden" name="form_type" value="customer">
      <input type="hidden" name="contact[tags]" value="newsletter,upcoming">
      <svg aria-hidden="true"><use href="#mail"/></svg>
      <label for="email" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Email</label>
      <input id="email" type="email" name="contact[email]" placeholder="Your email here…" required autocomplete="email">
      <button type="submit">Keep me posted ♥</button>
    </form>
    <p class="small">random drops, first dibs ★ good things take time</p>
    <a class="back" href="../">← back to the shop</a>
  </div>
</main>

<section class="peek" aria-labelledby="peekTitle">
  <h2 id="peekTitle">Sneak peek ★</h2>
  <p>Design in progress — final kit may change.</p>
  <div class="peek-row">
    <figure><img src="img/kit-front.webp" width="734" height="1018" alt="Kit design in progress: lilac and butter checkerboard with a bubbly pink WYLD logo, a Good Vibes badge and a Let's Be Crazy badge" loading="lazy"><figcaption>checkers + good vibes</figcaption></figure>
    <figure><img src="img/kit-sleeve.webp" width="270" height="650" alt="Sleeve print in progress: rainbows, smileys, hearts, stars and flowers on butter yellow" loading="lazy"><figcaption>random sticker sleeve</figcaption></figure>
  </div>
</section>
</body>
</html>
