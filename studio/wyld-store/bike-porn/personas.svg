    <path d="M18 92c-6-22-4-52 8-66 10-12 38-12 48 0 12 14 14 44 8 66-6-4-8-12-8-20l-4-26H30l-4 26c0 8-2 16-8 20z" fill="#ffd86b" stroke="#241a33" stroke-width="3.5" stroke-linejoin="round"/>
    <ellipse cx="50" cy="52" rx="20" ry="24" fill="#ffd9c2" stroke="#241a33" stroke-width="3.5"/>
    <path d="M30 40c6-12 26-16 38-4-10-2-22 0-38 4z" fill="#ffd86b" stroke="#241a33" stroke-width="3" stroke-linejoin="round"/>
