  <symbol id="weirdo" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" fill="#f8ebae"/>
    <circle cx="50" cy="52" r="32" fill="#c9b6f4" stroke="#241a33" stroke-width="3.5"/>
    <circle cx="38" cy="46" r="9" fill="#fff" stroke="#241a33" stroke-width="3"/><circle cx="40" cy="47" r="4" fill="#241a33"/>
    <circle cx="63" cy="44" r="5" fill="#fff" stroke="#241a33" stroke-width="3"/><circle cx="62" cy="45" r="2" fill="#241a33"/>
