    <path d="M26 84c8-8 40-8 48 0" fill="#fff" stroke="#140608" stroke-width="3"/>
    <path d="M20 42c-6-10 2-24 12-22 2-8 14-11 18-4 5-7 18-4 18 5 11-1 17 12 10 21" fill="#ff7a3d" stroke="#140608" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="50" cy="54" r="27" fill="#ffd9c2" stroke="#140608" stroke-width="3.5"/>
    <circle cx="40" cy="52" r="7" fill="#fff" stroke="#140608" stroke-width="3"/><circle cx="60" cy="52" r="7" fill="#fff" stroke="#140608" stroke-width="3"/>
    <circle cx="41" cy="53" r="3.8" fill="#3fa9e0"/><circle cx="61" cy="53" r="3.8" fill="#3fa9e0"/>
    <circle cx="41" cy="53" r="1.8" fill="#140608"/><circle cx="61" cy="53" r="1.8" fill="#140608"/>
    <path d="M40 66c6 5 14 5 20 0" fill="none" stroke="#140608" stroke-width="3" stroke-linecap="round"/>
    <path d="M43 64l-1 5M50 65v5M57 64l1 5" stroke="#140608" stroke-width="2" stroke-linecap="round"/>
    <path d="M66 58l7 9M67 64l4-4" stroke="#c43b4f" stroke-width="2.4" stroke-linecap="round"/>
