    <path d="M22 40l6-6 6 5 7-7 3 9-5 8-9 1-7-4z" fill="#ff5fa2" stroke="#241a33" stroke-width="3" stroke-linejoin="round"/>
    <path d="M78 40l-6-6-6 5-7-7-3 9 5 8 9 1 7-4z" fill="#ff5fa2" stroke="#241a33" stroke-width="3" stroke-linejoin="round"/>
    <path d="M44 43h12" stroke="#241a33" stroke-width="3"/>
    <path d="M30 40l5-3M64 40l5-3" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <path d="M40 64c5 5 15 5 20 0-5-2-6 1-10 1s-5-3-10-1z" fill="#e0115f" stroke="#241a33" stroke-width="2.5" stroke-linejoin="round"/>
