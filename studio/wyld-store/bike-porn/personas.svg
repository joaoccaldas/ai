    <circle cx="41" cy="55" r="3" fill="#0a1418"/><circle cx="59" cy="55" r="3" fill="#0a1418"/>
    <path d="M43 68c4-2 10-2 14 0" fill="none" stroke="#0a1418" stroke-width="3" stroke-linecap="round"/>
    <rect x="59" y="60" width="10" height="6" rx="2" fill="#fff6d8" stroke="#0a1418" stroke-width="2" transform="rotate(-20 64 63)"/>
    <path d="M10 84l18-8 4 8-18 8z" fill="#c9ccd1" stroke="#0a1418" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M28 76l22-14M32 84l24-10" stroke="#ffe7a8" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  </symbol>

