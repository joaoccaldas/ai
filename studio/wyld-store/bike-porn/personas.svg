    <path d="M72 30c14 4 18 22 10 40-2-10-6-16-12-20z" fill="#3a2418" stroke="#0a1418" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="50" cy="55" rx="22" ry="26" fill="#f2c9a8" stroke="#0a1418" stroke-width="3.5"/>
    <path d="M28 50c-2-18 8-28 22-28s24 8 22 26c-8-4-14-10-18-16-6 8-14 14-26 18z" fill="#3a2418" stroke="#0a1418" stroke-width="3.5" stroke-linejoin="round"/>
