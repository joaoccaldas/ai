    <path d="M26 50c-2-18 10-28 24-28s26 10 24 28c-6-10-14-14-24-14s-18 4-24 14z" fill="#f4d774" stroke="#241a33" stroke-width="3.5" stroke-linejoin="round"/>
    <g stroke="#241a33" stroke-width="2"><circle cx="30" cy="30" r="5" fill="#ff8fbf"/><circle cx="41" cy="23" r="5" fill="#fff"/><circle cx="52" cy="21" r="5" fill="#8fe7dc"/><circle cx="63" cy="24" r="5" fill="#ffd84a"/><circle cx="72" cy="31" r="5" fill="#ff8fbf"/></g>
    <circle cx="40" cy="54" r="6" fill="#fff" stroke="#241a33" stroke-width="2.5"/><circle cx="60" cy="54" r="6" fill="#fff" stroke="#241a33" stroke-width="2.5"/>
    <circle cx="40" cy="54" r="2" fill="#3fa9e0"/><circle cx="60" cy="54" r="2" fill="#3fa9e0"/>
    <path d="M34 67c8 9 24 9 32 0" fill="#fff" stroke="#241a33" stroke-width="3" stroke-linejoin="round"/>
    <path d="M40 67.5v4M46 69v5M52 69v5M58 67.5v4" stroke="#241a33" stroke-width="1.6"/>
    <ellipse cx="31" cy="63" rx="4" ry="2.5" fill="#ff8fbf" opacity=".7"/><ellipse cx="69" cy="63" rx="4" ry="2.5" fill="#ff8fbf" opacity=".7"/>
  </symbol>

  <!-- The Final Girl: dark ponytail, plaster on the cheek, determined brows, torch in hand -->
  <symbol id="final" viewBox="0 0 100 100">
