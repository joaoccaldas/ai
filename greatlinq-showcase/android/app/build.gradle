plugins {
    id 'com.android.application'
}

def showcaseFiles = ['index.html', 'app.js', 'model.js', 'styles.css', 'mark.svg', 'pump.svg', 'fallback-world.svg', 'VISITOR-NOTE.txt']
def assetOutput = layout.buildDirectory.dir('generated/showcase-assets')
tasks.register('stageShowcaseAssets', Sync) {
    from(rootProject.projectDir.parentFile) { include showcaseFiles }
    into(assetOutput)
}

android {
    sourceSets.main.assets.srcDirs += [assetOutput.get().asFile]
    namespace 'ai.ond.spatialshowcase'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.ond.spatialshowcase'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('ONDA_SHOWCASE_VERSION_CODE') ?: '1')
        versionName System.getenv('ONDA_SHOWCASE_VERSION_NAME') ?: '0.1.0-preview'
    }

    buildTypes {
        debug {
            debuggable true
            // Github Actions debug signature: safe for personal evaluation, not Play Store distribution.
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

tasks.named("preBuild") { dependsOn tasks.named("stageShowcaseAssets") }