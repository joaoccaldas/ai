name: STRIDE source tests
on:
  push:
    paths: ['projects/stride/**']
  pull_request:
    paths: ['projects/stride/**']
jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/stride
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check