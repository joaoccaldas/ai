name: CaldasLog App

on:
  pull_request:
    paths:
      - "caldaslog/app/**"
      - ".github/workflows/caldaslog-app.yml"
  push:
    branches: [main]
    paths:
      - "caldaslog/app/**"
      - ".github/workflows/caldaslog-app.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify shipped application bundle
        run: python3 caldaslog/app/verify.py
