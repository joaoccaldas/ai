name: NOEMA Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"
  push:
    branches: [main]
    paths:
      - 'projects/noema/scripts/build_benchmark.py'
      - '.github/workflows/noema-benchmark.yml'

permissions:
  contents: write

jobs:
  dplace-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch canonical D-PLACE society table
        run: curl --fail --location --retry 3 --output dplace-societies.csv https://raw.githubusercontent.com/D-PLACE/dplace-cldf/master/cldf/societies.csv
      - name: Build deterministic benchmark
        run: python projects/noema/scripts/build_benchmark.py dplace-societies.csv --size 100 --output noema-benchmark-100.json
      - name: Validate benchmark
        run: |
          python - <<'PY'
          import json
          data=json.load(open('noema-benchmark-100.json'))
          assert data['actual_size'] == 100
          societies=data['societies']
          ids=[x['dplace_id'] for x in societies]
          assert len(ids)==len(set(ids))
          assert all(x['region'] for x in societies)
          assert all(x['glottocode'] for x in societies)
          assert all(x['latitude'] is not None and x['longitude'] is not None for x in societies)
          regions=len({x['region'] for x in societies})
          assert regions >= 40
          print('validated benchmark across', regions, 'regions')
          PY
      - name: Publish benchmark projection into observatory tree
        run: cp noema-benchmark-100.json projects/noema/site/societies.json
      - name: Commit benchmark projection when upstream changed
        run: |
          set -euo pipefail
          if git diff --quiet -- projects/noema/site/societies.json; then
            echo "D-PLACE benchmark projection unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/noema/site/societies.json
          git commit -m "data(noema): refresh D-PLACE benchmark [skip noema-benchmark]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: noema-dplace-benchmark-100
          path: noema-benchmark-100.json
          retention-days: 90
