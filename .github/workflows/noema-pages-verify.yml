name: NOEMA Public Observatory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/noema/site/**'
      - 'projects/noema/data/reviewed/**'
      - 'projects/noema/data/comparisons/**'
      - 'projects/noema/data/reference/**'
      - 'projects/noema/data/runs/**'
      - 'projects/noema/data/candidates/wikimedia-media-candidates.json'
      - 'projects/noema/ontology/**'
      - '.github/workflows/noema-pages-verify.yml'

permissions:
  contents: read

jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify complete NOEMA v1.2 bundle on GitHub Pages
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
        run: |
          # Do not enable pipefail here: grep -q intentionally closes its input early
          # after a successful match, which can make printf report EPIPE and turn a
          # valid public match into a false-negative verifier failure.
          set -eu
          base="https://${OWNER}.github.io/${REPO}/projects/noema/site"; rootbase="https://${OWNER}.github.io/${REPO}/projects/noema"; bust="?build=${SHA}"
          echo "NOEMA_PUBLIC_URL=${base}/"
          ok=0
          get(){ curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "$1" || true; }
          for attempt in $(seq 1 120); do
            root=$(get "${base}/${bust}")
            meta=$(get "${base}/data.json${bust}")
            explore=$(get "${base}/explore.html${bust}")
            library=$(get "${base}/library.html${bust}")
            research=$(get "${base}/research.html${bust}")
            gods=$(get "${base}/gods.html${bust}")
            entity=$(get "${base}/entity.html${bust}")
            connections=$(get "${base}/lineages.html${bust}")
            patterns=$(get "${base}/patterns.html${bust}")
            simulations=$(get "${base}/simulations.html${bust}")
            atlas_html=$(get "${base}/human-meaning-atlas.html${bust}")
            deep_html=$(get "${base}/deep-time.html${bust}")
            federation=$(get "${base}/religion-federation.json${bust}")
            pattern_json=$(get "${base}/pattern-candidates.json${bust}")
            health=$(get "${base}/research-health.json${bust}")
            pulse=$(get "${base}/automation-pulse.json${bust}")
            museum_media=$(get "${base}/museum-reference-media.json${bust}")
            catalog=$(get "${rootbase}/data/reference/belief-catalog-v1.json${bust}")
            ontology=$(get "${rootbase}/ontology/decomposition_v1.json${bust}")

            if printf '%s' "$root" | grep -q '<title>NOEMA · Human Belief, Decomposed</title>' \
              && printf '%s' "$root" | grep -q 'Explore how humans have understood existence\|Human belief,' \
              && printf '%s' "$root" | grep -q 'href="library.html">Library' \
              && printf '%s' "$root" | grep -q 'href="research.html">Research' \
              && printf '%s' "$meta" | grep -q '"release": "v1.2"' \
              && printf '%s' "$meta" | grep -q 'five_area_navigation' \
              && printf '%s' "$explore" | grep -q '<title>Explore · NOEMA</title>' \
              && printf '%s' "$library" | grep -q '<title>Library · NOEMA</title>' \
              && printf '%s' "$library" | grep -q 'Start with what you want to understand.' \
              && printf '%s' "$research" | grep -q '<title>Research · NOEMA</title>' \
              && printf '%s' "$research" | grep -q 'The machinery stays available.' \
              && printf '%s' "$gods" | grep -q 'Every god gets a workspace.' \
              && printf '%s' "$entity" | grep -q 'entity-v2.js' \
              && printf '%s' "$connections" | grep -q 'Navigate associations. Attack patterns.' \
              && printf '%s' "$connections" | grep -q 'href="library.html">Library' \
              && printf '%s' "$patterns" | grep -q '<title>Patterns · NOEMA</title>' \
              && printf '%s' "$simulations" | grep -q '<title>Simulations · NOEMA</title>' \
              && printf '%s' "$atlas_html" | grep -q '<title>NOEMA Human Meaning Atlas</title>' \
              && printf '%s' "$deep_html" | grep -q '<title>NOEMA Deep Time</title>' \
              && printf '%s' "$federation" | grep -q 'accepted_semantic_assertions' \
              && printf '%s' "$pattern_json" | grep -q 'HYPOTHESIS_GENERATION_ONLY' \
              && printf '%s' "$pattern_json" | grep -q 'profiles_excluded_for_pair_missingness' \
              && printf '%s' "$health" | grep -q 'NOEMA-RESEARCH-HEALTH-V1' \
              && printf '%s' "$pulse" | grep -q 'NOEMA-AUTOMATION-PULSE-V1' \
              && printf '%s' "$museum_media" | grep -q 'REFERENCE_MEDIA_PROVIDER_ASSERTED_NOT_EVIDENCE' \
              && printf '%s' "$catalog" | grep -q 'GOD-ODIN' \
              && printf '%s' "$ontology" | grep -q 'NOEMA-DECOMPOSITION-V1'; then
              ok=1
              echo "NOEMA v1.2 simplified UX + federation + connections + media verified on attempt ${attempt}."
              break
            fi
            echo "Attempt ${attempt}: Pages has not exposed the complete NOEMA v1.2 bundle yet."
            sleep 5
          done
          test "$ok" = "1"
