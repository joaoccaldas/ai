name: NOEMA Public Observatory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/noema/site/**'
      - 'projects/noema/data/reviewed/**'
      - 'projects/noema/data/comparisons/**'
      - 'projects/noema/data/reference/**'
      - 'projects/noema/ontology/**'
      - '.github/workflows/noema-pages-verify.yml'

permissions:
  contents: read

jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify NOEMA v1 research OS and projections on GitHub Pages
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://${OWNER}.github.io/${REPO}/projects/noema/site"
          bust="?build=${SHA}"
          echo "NOEMA_PUBLIC_URL=${base}/"
          echo "NOEMA_EXPLORE_URL=${base}/explore.html"
          echo "NOEMA_GODS_URL=${base}/gods.html"
          echo "NOEMA_DRH_URL=${base}/drh.html"
          echo "NOEMA_SIMULATIONS_URL=${base}/simulations.html"
          echo "NOEMA_DECOMPOSITION_URL=${base}/religion-decomposition.html"
          echo "NOEMA_HUMAN_MEANING_ATLAS_URL=${base}/human-meaning-atlas.html"

          ok=0
          for attempt in $(seq 1 120); do
            root=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/${bust}" || true)
            explore=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/explore.html${bust}" || true)
            systems=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/belief-systems.html${bust}" || true)
            gods=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/gods.html${bust}" || true)
            patterns=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/patterns.html${bust}" || true)
            compare=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/compare.html${bust}" || true)
            simulations=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/simulations.html${bust}" || true)
            drh_page=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/drh.html${bust}" || true)
            entity=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/entity.html?id=GOD-ODIN&build=${SHA}" || true)
            workbench=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/religion-decomposition.html${bust}" || true)
            decomposition=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/religion-decomposition.json${bust}" || true)
            drh=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/drh-decomposition.json${bust}" || true)
            catalog=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "https://${OWNER}.github.io/${REPO}/projects/noema/data/reference/belief-catalog-v1.json${bust}" || true)
            ontology=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "https://${OWNER}.github.io/${REPO}/projects/noema/ontology/decomposition_v1.json${bust}" || true)
            atlas_html=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/human-meaning-atlas.html${bust}" || true)
            atlas=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/human-meaning-atlas.json${bust}" || true)
            deep_html=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/deep-time.html${bust}" || true)
            comparison=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/deep-time-comparison.json${bust}" || true)
            coverage=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "${base}/societies.json${bust}" || true)
            if printf '%s' "$root" | grep -q '<title>NOEMA Observatory</title>' \
              && printf '%s' "$root" | grep -q 'Search beneath religion.' \
              && printf '%s' "$root" | grep -q 'One graph, many lenses' \
              && printf '%s' "$explore" | grep -q '<title>Explore · NOEMA</title>' \
              && printf '%s' "$systems" | grep -q '<title>Belief Systems · NOEMA</title>' \
              && printf '%s' "$gods" | grep -q '<title>Gods & Spirits · NOEMA</title>' \
              && printf '%s' "$patterns" | grep -q '<title>Patterns · NOEMA</title>' \
              && printf '%s' "$compare" | grep -q '<title>Compare · NOEMA</title>' \
              && printf '%s' "$simulations" | grep -q '<title>Simulations · NOEMA</title>' \
              && printf '%s' "$simulations" | grep -q 'Is a pattern surprising?' \
              && printf '%s' "$drh_page" | grep -q '<title>DRH Explorer · NOEMA</title>' \
              && printf '%s' "$drh_page" | grep -q 'Entries, questions, metadata.' \
              && printf '%s' "$entity" | grep -q '<title>Entity · NOEMA</title>' \
              && printf '%s' "$workbench" | grep -q '<title>NOEMA Religion Decomposition</title>' \
              && printf '%s' "$workbench" | grep -q 'Search religion beneath religion' \
              && printf '%s' "$decomposition" | grep -q 'NOEMA-RELIGION-DECOMPOSITION-PULOTU-V1' \
              && printf '%s' "$decomposition" | grep -q 'accepted_assertions' \
              && printf '%s' "$drh" | grep -q 'NOEMA-RELIGION-DECOMPOSITION-DRH-V1' \
              && printf '%s' "$drh" | grep -q 'mapped_questions' \
              && printf '%s' "$catalog" | grep -q 'NOEMA-BELIEF-CATALOG-V1' \
              && printf '%s' "$catalog" | grep -q 'GOD-ODIN' \
              && printf '%s' "$ontology" | grep -q 'NOEMA-DECOMPOSITION-V1' \
              && printf '%s' "$ontology" | grep -q 'ALTERED_STATE_INDUCTION' \
              && printf '%s' "$atlas_html" | grep -q '<title>NOEMA Human Meaning Atlas</title>' \
              && printf '%s' "$atlas" | grep -q 'NOEMA-HUMAN-MEANING-ATLAS-001' \
              && printf '%s' "$deep_html" | grep -q '<title>NOEMA Deep Time</title>' \
              && printf '%s' "$comparison" | grep -q 'NOEMA-DEEP-TIME-COMPARE-001' \
              && printf '%s' "$coverage" | grep -q 'NOEMA-DPLACE-100-v1'; then
              ok=1
              echo "NOEMA v1 Research OS, Pulotu + DRH decomposition corpora, simulations, entity/search pages, Atlas and Deep Time verified on attempt ${attempt}."
              break
            fi
            echo "Attempt ${attempt}: Pages has not exposed the complete NOEMA v1 bundle yet."
            sleep 5
          done
          test "$ok" = "1"
