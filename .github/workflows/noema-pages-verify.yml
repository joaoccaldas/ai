name: NOEMA Public Observatory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/noema/site/**'
      - 'projects/noema/data/reviewed/**'
      - 'projects/noema/data/comparisons/**'
      - 'projects/noema/data/reference/**'
      - 'projects/noema/data/runs/**'
      - 'projects/noema/data/candidates/wikimedia-media-candidates.json'
      - 'projects/noema/ontology/**'
      - '.github/workflows/noema-pages-verify.yml'

permissions:
  contents: read

jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify complete NOEMA Research OS bundle on GitHub Pages
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://${OWNER}.github.io/${REPO}/projects/noema/site"; rootbase="https://${OWNER}.github.io/${REPO}/projects/noema"; bust="?build=${SHA}"
          echo "NOEMA_PUBLIC_URL=${base}/"
          ok=0
          get(){ curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "$1" || true; }
          for attempt in $(seq 1 120); do
            root=$(get "${base}/${bust}"); pulse_page=$(get "${base}/automation-pulse.html${bust}"); health_page=$(get "${base}/research-health.html${bust}"); explore=$(get "${base}/explore.html${bust}"); gods=$(get "${base}/gods.html${bust}"); patterns=$(get "${base}/patterns.html${bust}"); simulations=$(get "${base}/simulations.html${bust}"); drh_page=$(get "${base}/drh.html${bust}"); workbench=$(get "${base}/religion-decomposition.html${bust}"); atlas_html=$(get "${base}/human-meaning-atlas.html${bust}"); deep_html=$(get "${base}/deep-time.html${bust}")
            federation=$(get "${base}/religion-federation.json${bust}"); pattern_json=$(get "${base}/pattern-candidates.json${bust}"); health=$(get "${base}/research-health.json${bust}"); pulse=$(get "${base}/automation-pulse.json${bust}"); coverage_matrix=$(get "${base}/coverage-matrix.json${bust}"); decomposition=$(get "${base}/religion-decomposition.json${bust}"); drh=$(get "${base}/drh-decomposition.json${bust}"); societies=$(get "${base}/societies.json${bust}"); atlas=$(get "${base}/human-meaning-atlas.json${bust}"); comparison=$(get "${base}/deep-time-comparison.json${bust}"); catalog=$(get "${rootbase}/data/reference/belief-catalog-v1.json${bust}"); ontology=$(get "${rootbase}/ontology/decomposition_v1.json${bust}"); media=$(get "${rootbase}/data/candidates/wikimedia-media-candidates.json${bust}")
            if printf '%s' "$root" | grep -q '<title>NOEMA Research OS</title>' \
              && printf '%s' "$root" | grep -q 'Human belief,' \
              && printf '%s' "$root" | grep -q 'Automation Pulse' \
              && printf '%s' "$pulse_page" | grep -q '<title>Automation Pulse · NOEMA</title>' \
              && printf '%s' "$health_page" | grep -q '<title>Research Health · NOEMA</title>' \
              && printf '%s' "$explore" | grep -q '<title>Explore · NOEMA</title>' \
              && printf '%s' "$gods" | grep -q '<title>Gods & Spirits · NOEMA</title>' \
              && printf '%s' "$patterns" | grep -q '<title>Patterns · NOEMA</title>' \
              && printf '%s' "$simulations" | grep -q '<title>Simulations · NOEMA</title>' \
              && printf '%s' "$drh_page" | grep -q '<title>DRH Explorer · NOEMA</title>' \
              && printf '%s' "$workbench" | grep -q '<title>NOEMA Religion Decomposition</title>' \
              && printf '%s' "$atlas_html" | grep -q '<title>NOEMA Human Meaning Atlas</title>' \
              && printf '%s' "$deep_html" | grep -q '<title>NOEMA Deep Time</title>' \
              && printf '%s' "$federation" | grep -q 'accepted_semantic_assertions' \
              && printf '%s' "$pattern_json" | grep -q 'HYPOTHESIS_GENERATION_ONLY' \
              && printf '%s' "$health" | grep -q 'NOEMA-RESEARCH-HEALTH-V1' \
              && printf '%s' "$pulse" | grep -q 'NOEMA-AUTOMATION-PULSE-V1' \
              && printf '%s' "$coverage_matrix" | grep -q 'PULOTU' \
              && printf '%s' "$decomposition" | grep -q 'NOEMA-RELIGION-DECOMPOSITION-PULOTU-V1' \
              && printf '%s' "$drh" | grep -q 'NOEMA-RELIGION-DECOMPOSITION-DRH-V1' \
              && printf '%s' "$societies" | grep -q 'NOEMA-DPLACE-100-v1' \
              && printf '%s' "$atlas" | grep -q 'NOEMA-HUMAN-MEANING-ATLAS-001' \
              && printf '%s' "$comparison" | grep -q 'NOEMA-DEEP-TIME-COMPARE-001' \
              && printf '%s' "$catalog" | grep -q 'GOD-ODIN' \
              && printf '%s' "$ontology" | grep -q 'NOEMA-DECOMPOSITION-V1' \
              && printf '%s' "$media" | grep -q 'PENDING_IDENTITY_AND_RIGHTS_REVIEW'; then
              ok=1; echo "NOEMA Research OS + federation + automation pulse + health + media gate verified on attempt ${attempt}."; break
            fi
            echo "Attempt ${attempt}: Pages has not exposed the complete NOEMA bundle yet."; sleep 5
          done
          test "$ok" = "1"
