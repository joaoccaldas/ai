name: NOEMA Public Observatory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/noema/site/**'
      - '.github/workflows/noema-pages-verify.yml'

permissions:
  contents: read

jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify NOEMA observatory and projection on GitHub Pages
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://${OWNER}.github.io/${REPO}/projects/noema/site"
          page="${base}/?build=${SHA}"
          data="${base}/data.json?build=${SHA}"
          echo "NOEMA_PUBLIC_URL=${base}/"

          ok=0
          for attempt in $(seq 1 60); do
            html=$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, must-revalidate' \
              "$page" || true)
            projection=$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, must-revalidate' \
              "$data" || true)
            if printf '%s' "$html" | grep -q '<title>NOEMA Observatory</title>' \
              && printf '%s' "$html" | grep -q 'Similarity generates a question, never a conclusion' \
              && printf '%s' "$projection" | grep -q '"status": "seed"'; then
              ok=1
              echo "NOEMA public observatory verified on attempt ${attempt}."
              break
            fi
            echo "Attempt ${attempt}: Pages has not exposed the NOEMA observatory yet."
            sleep 5
          done
          test "$ok" = "1"
