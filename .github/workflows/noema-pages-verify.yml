name: NOEMA Public Observatory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/noema/site/**'
      - 'projects/noema/data/reviewed/**'
      - 'projects/noema/data/comparisons/**'
      - 'projects/noema/data/reference/**'
      - 'projects/noema/data/runs/**'
      - 'projects/noema/data/candidates/**'
      - 'projects/noema/docs/**'
      - 'projects/noema/ontology/**'
      - '.github/workflows/noema-pages-verify.yml'

permissions:
  contents: read

jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify complete NOEMA v1.7 bundle on GitHub Pages
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
        run: |
          # grep -q intentionally closes input early after success; do not use pipefail.
          set -eu
          base="https://${OWNER}.github.io/${REPO}/projects/noema/site"; rootbase="https://${OWNER}.github.io/${REPO}/projects/noema"; bust="?build=${SHA}"
          echo "NOEMA_PUBLIC_URL=${base}/"
          ok=0
          get(){ curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "$1" || true; }
          for attempt in $(seq 1 120); do
            root=$(get "${base}/${bust}")
            meta=$(get "${base}/data.json${bust}")
            explore=$(get "${base}/explore.html${bust}")
            explore_bridge=$(get "${base}/explore-v14.js${bust}")
            concept=$(get "${base}/concept.html${bust}")
            concept_js=$(get "${base}/concept-v1.js${bust}")
            synoptic_js=$(get "${base}/synoptic-v15.js${bust}")
            synoptic_css=$(get "${base}/synoptic-v15.css${bust}")
            library=$(get "${base}/library.html${bust}")
            research=$(get "${base}/research.html${bust}")
            cognition=$(get "${base}/cognition.html${bust}")
            cognition_js=$(get "${base}/cognition.js${bust}")
            source_registry=$(get "${base}/source-registry-v17.json${bust}")
            cognition_ontology=$(get "${rootbase}/data/reference/cognition-mechanism-ontology-v1.json${bust}")
            pubmed_seed=$(get "${rootbase}/data/candidates/pubmed-cognition-seed-v1.json${bust}")
            gods=$(get "${base}/gods.html${bust}")
            entity=$(get "${base}/entity.html${bust}")
            entity_depth=$(get "${base}/entity-depth-v14.js${bust}")
            connections=$(get "${base}/lineages.html${bust}")
            patterns=$(get "${base}/patterns.html${bust}")
            simulations=$(get "${base}/simulations.html${bust}")
            atlas_html=$(get "${base}/human-meaning-atlas.html${bust}")
            deep_html=$(get "${base}/deep-time.html${bust}")
            federation=$(get "${base}/religion-federation.json${bust}")
            pattern_json=$(get "${base}/pattern-candidates.json${bust}")
            health=$(get "${base}/research-health.json${bust}")
            pulse=$(get "${base}/automation-pulse.json${bust}")
            museum_media=$(get "${base}/museum-reference-media.json${bust}")
            catalog=$(get "${rootbase}/data/reference/belief-catalog-v1.json${bust}")
            ontology=$(get "${rootbase}/ontology/decomposition_v1.json${bust}")

            if printf '%s' "$root" | grep -q '<title>NOEMA · Religion, Ritual & Belief, Decomposed</title>' \
              && printf '%s' "$root" | grep -q 'evidence-backed atlas and comparison engine for religion, ritual, mythology and spiritual practice' \
              && printf '%s' "$root" | grep -q '01 · LOOK UP' \
              && printf '%s' "$root" | grep -q '02 · COMPARE' \
              && printf '%s' "$root" | grep -q '03 · TRACE PATTERNS' \
              && printf '%s' "$root" | grep -q '01 · IDENTIFY' \
              && printf '%s' "$root" | grep -q '04 · TEST' \
              && printf '%s' "$meta" | grep -q '"release": "v1.7"' \
              && printf '%s' "$meta" | grep -q 'synchronized_synoptic_lens' \
              && printf '%s' "$meta" | grep -q 'historical_diagnosis_from_resemblance' \
              && printf '%s' "$meta" | grep -q 'pubmed_is_discovery_only' \
              && printf '%s' "$explore" | grep -q 'What do you want to understand?' \
              && printf '%s' "$explore" | grep -q 'explore-v14.js' \
              && printf '%s' "$concept" | grep -q 'One idea, many contexts' \
              && printf '%s' "$concept_js" | grep -q 'Co-coded ≠ connected history' \
              && printf '%s' "$synoptic_js" | grep -q 'Map · Time · Graph · Evidence' \
              && printf '%s' "$synoptic_css" | grep -q 'synoptic-map' \
              && printf '%s' "$library" | grep -q '<title>Library · NOEMA</title>' \
              && printf '%s' "$research" | grep -q 'Cognition & experience' \
              && printf '%s' "$cognition" | grep -q 'Mechanism is not meaning' \
              && printf '%s' "$cognition" | grep -q 'Witches, shamans, mystics, prophets and mediums are not diagnoses' \
              && printf '%s' "$cognition_js" | grep -q 'PubMed candidate' \
              && printf '%s' "$source_registry" | grep -q 'PubMed / MEDLINE' \
              && printf '%s' "$source_registry" | grep -q 'historical_diagnosis_from_resemblance' \
              && printf '%s' "$cognition_ontology" | grep -q 'NEURODEVELOPMENTAL_VARIATION' \
              && printf '%s' "$cognition_ontology" | grep -q 'historical_diagnosis_allowed' \
              && printf '%s' "$pubmed_seed" | grep -q 'CANDIDATE_ONLY_HUMAN_REVIEW_REQUIRED' \
              && printf '%s' "$pubmed_seed" | grep -q 'Criticisms of the psychopathological interpretation of witch hunts' \
              && printf '%s' "$gods" | grep -q 'Every god gets a workspace.' \
              && printf '%s' "$entity" | grep -q 'entity-depth-v14.js' \
              && printf '%s' "$entity_depth" | grep -q 'Reference sources ≠ claim-level evidence' \
              && printf '%s' "$connections" | grep -q 'Navigate associations. Attack patterns.' \
              && printf '%s' "$patterns" | grep -q '<title>Patterns · NOEMA</title>' \
              && printf '%s' "$simulations" | grep -q '<title>Simulations · NOEMA</title>' \
              && printf '%s' "$atlas_html" | grep -q '<title>NOEMA Human Meaning Atlas</title>' \
              && printf '%s' "$deep_html" | grep -q '<title>NOEMA Deep Time</title>' \
              && printf '%s' "$federation" | grep -q 'accepted_semantic_assertions' \
              && printf '%s' "$pattern_json" | grep -q 'HYPOTHESIS_GENERATION_ONLY' \
              && printf '%s' "$health" | grep -q 'NOEMA-RESEARCH-HEALTH-V1' \
              && printf '%s' "$pulse" | grep -q 'NOEMA-AUTOMATION-PULSE-V1' \
              && printf '%s' "$museum_media" | grep -q 'REFERENCE_MEDIA_PROVIDER_ASSERTED_NOT_EVIDENCE' \
              && printf '%s' "$catalog" | grep -q 'GOD-ODIN' \
              && printf '%s' "$ontology" | grep -q 'NOEMA-DECOMPOSITION-V1'; then
              ok=1
              echo "NOEMA v1.7 cognition + PubMed + synchronized visual research bundle verified on attempt ${attempt}."
              break
            fi
            echo "Attempt ${attempt}: Pages has not exposed the complete NOEMA v1.7 bundle yet."
            sleep 5
          done
          test "$ok" = "1"
