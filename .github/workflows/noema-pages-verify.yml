name: NOEMA Public Observatory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/noema/site/**'
      - 'projects/noema/data/reviewed/**'
      - 'projects/noema/data/comparisons/**'
      - '.github/workflows/noema-pages-verify.yml'

permissions:
  contents: read

jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify NOEMA observatory and research projections on GitHub Pages
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://${OWNER}.github.io/${REPO}/projects/noema/site"
          page="${base}/?build=${SHA}"
          atlas_page="${base}/human-meaning-atlas.html?build=${SHA}"
          atlas_json="${base}/human-meaning-atlas.json?build=${SHA}"
          deep_time="${base}/deep-time.html?build=${SHA}"
          compare="${base}/deep-time-compare.html?build=${SHA}"
          comparison_json="${base}/deep-time-comparison.json?build=${SHA}"
          data="${base}/data.json?build=${SHA}"
          evidence="https://${OWNER}.github.io/${REPO}/projects/noema/data/reviewed/evidence-pack-001.json?build=${SHA}"
          deep_evidence="https://${OWNER}.github.io/${REPO}/projects/noema/data/reviewed/evidence-pack-002-deep-time.json?build=${SHA}"
          sapiens_evidence="https://${OWNER}.github.io/${REPO}/projects/noema/data/reviewed/evidence-pack-003-homo-sapiens.json?build=${SHA}"
          societies="${base}/societies.json?build=${SHA}"
          echo "NOEMA_PUBLIC_URL=${base}/"
          echo "NOEMA_HUMAN_MEANING_ATLAS_URL=${base}/human-meaning-atlas.html"
          echo "NOEMA_DEEP_TIME_URL=${base}/deep-time.html"
          echo "NOEMA_DEEP_TIME_COMPARE_URL=${base}/deep-time-compare.html"

          ok=0
          for attempt in $(seq 1 96); do
            html=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "$page" || true)
            atlas_html=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "$atlas_page" || true)
            atlas=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "$atlas_json" || true)
            deep_html=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "$deep_time" || true)
            compare_html=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "$compare" || true)
            comparison=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "$comparison_json" || true)
            projection=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "$data" || true)
            dossier=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "$evidence" || true)
            deep_dossier=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "$deep_evidence" || true)
            sapiens_dossier=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "$sapiens_evidence" || true)
            coverage=$(curl --fail --silent --show-error --location --header 'Cache-Control: no-cache, no-store, must-revalidate' "$societies" || true)
            if printf '%s' "$html" | grep -q '<title>NOEMA Observatory</title>' \
              && printf '%s' "$atlas_html" | grep -q '<title>NOEMA Human Meaning Atlas</title>' \
              && printf '%s' "$atlas_html" | grep -q '500,000 BP → present' \
              && printf '%s' "$deep_html" | grep -q '<title>NOEMA Deep Time</title>' \
              && printf '%s' "$compare_html" | grep -q '<title>NOEMA Deep Time Compare</title>' \
              && printf '%s' "$compare_html" | grep -q 'no species ranking' \
              && printf '%s' "$projection" | grep -q '"release": "v0.9"' \
              && printf '%s' "$projection" | grep -q 'human_meaning_atlas' \
              && printf '%s' "$dossier" | grep -q '"pack_id": "NOEMA-EVIDENCE-001"' \
              && printf '%s' "$deep_dossier" | grep -q '"pack_id": "NOEMA-EVIDENCE-002"' \
              && printf '%s' "$sapiens_dossier" | grep -q '"pack_id": "NOEMA-EVIDENCE-003"' \
              && printf '%s' "$comparison" | grep -q '"comparison_id": "NOEMA-DEEP-TIME-COMPARE-001"' \
              && printf '%s' "$comparison" | grep -q '"matched_constructs": 4' \
              && printf '%s' "$atlas" | grep -q '"atlas_id": "NOEMA-HUMAN-MEANING-ATLAS-001"' \
              && printf '%s' "$atlas" | grep -q '"release": "v0.9"' \
              && printf '%s' "$atlas" | grep -q '"coverage_societies": 100' \
              && printf '%s' "$atlas" | grep -q 'species ranking from evidence counts' \
              && printf '%s' "$coverage" | grep -q '"benchmark_id": "NOEMA-DPLACE-100-v1"' \
              && printf '%s' "$coverage" | grep -q '"actual_size": 100'; then
              ok=1
              echo "NOEMA v0.9 Observatory, Human Meaning Atlas, Deep Time, comparison projection and coverage verified on attempt ${attempt}."
              break
            fi
            echo "Attempt ${attempt}: Pages has not exposed all NOEMA v0.9 projections yet."
            sleep 5
          done
          test "$ok" = "1"
