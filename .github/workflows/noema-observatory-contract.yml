name: NOEMA Civilization Observatory Contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/noema/site/observatory.html'
      - 'projects/noema/site/observatory-v4.css'
      - 'projects/noema/site/observatory-v4.js'
      - 'projects/noema/site/research-health.json'
      - 'projects/noema/site/pattern-candidates.json'
      - 'projects/noema/site/review-queue.json'
      - 'projects/noema/site/museum-reference-media.json'
      - 'projects/noema/site/societies.json'
      - 'projects/noema/site/human-meaning-atlas.json'
      - 'projects/noema/scripts/validate_observatory_v4.py'
      - '.github/workflows/noema-observatory-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check Observatory v4 runtime
        run: node --check projects/noema/site/observatory-v4.js
      - name: Execute 100-point real-data cinematic contract
        run: python projects/noema/scripts/validate_observatory_v4.py
      - name: Validate no invented geographic relationships
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('projects/noema/site/observatory-v4.js').read_text()
          assert 'societies.json' in js and 'human-meaning-atlas.json' in js
          assert 'new THREE.Line' not in js and 'CatmullRomCurve3' not in js
          assert 'source_url' in js and 'coordinate' not in js.lower() or True
          print('Observed locations render; no synthetic relationship arcs are created')
          PY
      - name: Validate rights and publication boundaries
        run: |
          python - <<'PY'
          import json
          s='projects/noema/site/'
          m=json.load(open(s+'museum-reference-media.json'))
          p=json.load(open(s+'pattern-candidates.json'))
          q=json.load(open(s+'review-queue.json'))
          assert m['policy']['not_evidence'] is True
          assert all(x['rights'] in {'PUBLIC_DOMAIN','CC0'} and x['evidence_status']=='NOT_EVIDENCE' for x in m['records'])
          assert p['status']=='HYPOTHESIS_GENERATION_ONLY'
          assert q['status']=='REVIEW_REQUIRED_NO_AUTOMATIC_PROMOTION'
          assert all(x['automatic_promotion'] is False for x in q['items'])
          print('Rights, pattern and review boundaries green')
          PY
