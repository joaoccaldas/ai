name: NOEMA UI and Operations Contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/noema/site/**'
      - 'projects/noema/data/runs/**'
      - 'projects/noema/data/reference/**'
      - 'projects/noema/data/automation-contract-v1.json'
      - 'projects/noema/data/candidates/wikimedia-media-candidates.json'
      - 'projects/noema/schemas/run-manifest-v1.json'
      - 'projects/noema/scripts/build_automation_pulse.py'
      - '.github/workflows/noema-ui-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check browser JavaScript
        run: |
          node --check projects/noema/site/home-v2.js
          node --check projects/noema/site/app-v1.js
          node --check projects/noema/site/cards-v2.js
          node --check projects/noema/site/entity-v2.js
          node --check projects/noema/site/entity-depth-v14.js
          node --check projects/noema/site/explore-v14.js
          node --check projects/noema/site/concept-v1.js
          node --check projects/noema/site/synoptic-v15.js
          node --check projects/noema/site/relationship-v2.js
          node --check projects/noema/site/automation-pulse.js
          node --check projects/noema/site/pattern-v2.js
          node --check projects/noema/site/dashboard-v2.js

      - name: Build and validate automation pulse
        run: |
          python projects/noema/scripts/build_automation_pulse.py --output /tmp/automation-pulse.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/automation-pulse.json'))
          contract=json.load(open('projects/noema/data/automation-contract-v1.json'))
          assert d['status']=='OBSERVABILITY_ONLY'
          assert len(contract['tasks'])>=7 and len(d.get('task_health',[]))==len(contract['tasks'])
          assert {x['task_type'] for x in d['task_health']} >= {'GITHUB_DISCOVERY','DAILY_INGEST','DPLACE_BENCHMARK','RELIGION_FEDERATION','WEEKLY_REANALYSIS','MONTHLY_DISCOVERY','MEDIA_DISCOVERY'}
          assert all(x['authority'] and x['next_stage'] and x['writes'] for x in d['task_health'])
          for p in Path('projects/noema/data/runs').glob('*.json'):
              r=json.load(open(p));g=r['epistemic_guards']
              assert r['run_id'] and r['task_type'] and r['status']
              assert g['model_output_is_evidence'] is False
              assert g['unknown_is_absent'] is False
              assert g['similarity_implies_descent'] is False
              assert g['automatic_claim_promotion'] is False
          print('validated manifests', len(list(Path('projects/noema/data/runs').glob('*.json'))), 'and tasks', len(d['task_health']))
          PY

      - name: Validate v1.5 product-depth contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('projects/noema/site/index.html').read_text()
          assert '<title>NOEMA · Religion, Ritual & Belief, Decomposed</title>' in root
          for phrase in [
              'evidence-backed atlas and comparison engine for religion, ritual, mythology and spiritual practice',
              'href="explore.html">Explore','href="human-meaning-atlas.html">Atlas','href="lineages.html">Analyze',
              'href="library.html">Library','href="research.html">Research','What is NOEMA?',
              '01 · LOOK UP','02 · COMPARE','03 · TRACE PATTERNS',
              '01 · IDENTIFY','02 · DECOMPOSE','03 · COMPARE','04 · TEST','home-v2.js'
          ]:
              assert phrase in root, phrase
          assert 'Automation pulse' not in root and 'DRH explorer' not in root

          library=Path('projects/noema/site/library.html').read_text()
          assert '<title>Library · NOEMA</title>' in library and 'Start with what you want to understand.' in library
          research=Path('projects/noema/site/research.html').read_text()
          assert '<title>Research · NOEMA</title>' in research and 'The machinery stays available.' in research

          app=Path('projects/noema/site/app-v1.js').read_text()
          assert 'NAV_GROUPS' in app and "label:'Explore'" in app and "label:'World'" in app and "label:'Connections'" in app and "label:'Library'" in app and "label:'Research'" in app
          assert 'let limit=36' in app and 'Evidence, provenance and technical metadata' in app
          assert Path('projects/noema/site/ux-v12.css').exists()
          assert Path('projects/noema/site/clarity-v13.css').exists()

          entity=Path('projects/noema/site/entity.html').read_text()
          entity_depth=Path('projects/noema/site/entity-depth-v14.js').read_text()
          assert 'universal entity workspace' in entity and 'entity-v2.js' in entity and 'entity-depth-v14.js' in entity
          assert 'synoptic-v15.js' in entity and 'synoptic-v15.css' in entity
          assert 'concept.html?term=' in entity_depth and 'Reference sources ≠ claim-level evidence' in entity_depth
          concept=Path('projects/noema/site/concept.html').read_text()
          concept_js=Path('projects/noema/site/concept-v1.js').read_text()
          assert 'One idea, many contexts' in concept and 'concept-v1.js' in concept
          assert 'synoptic-v15.js' in concept and 'synoptic-v15.css' in concept
          for marker in ['Profiles','Regions','Time','Co-occurrence','Evidence','earliest encoded record is not an origin date','Co-coded ≠ connected history']:
              assert marker in concept_js
          explore=Path('projects/noema/site/explore.html').read_text()
          assert 'What do you want to understand?' in explore and 'Map it' in explore and 'Compare it' in explore and 'Analyze connections' in explore and 'cards-v2.js' in explore and 'explore-v14.js' in explore
          assert 'concept.html?term=' in Path('projects/noema/site/explore-v14.js').read_text()

          connections=Path('projects/noema/site/lineages.html').read_text()
          assert 'Reference association' in connections and 'Pattern candidate' in connections and 'relationship-v2.js' in connections
          gods=Path('projects/noema/site/gods.html').read_text()
          assert 'Every god gets a workspace.' in gods and 'cards-v2.js' in gods

          meta=json.load(open('projects/noema/site/data.json'))
          assert meta['release']=='v1.5'
          vc=meta['visual_core']
          assert vc['five_area_navigation'] is True and vc['product_category_explicit'] is True and vc['worked_entity_example'] is True
          assert vc['search_first_home'] is True and vc['progressive_result_loading'] is True and vc['research_metadata_collapsed_by_default'] is True
          assert vc['entity_workspace_v2'] is True and vc['relationship_dual_mode'] is True and vc['concept_hubs'] is True
          assert vc['search_to_concept_bridge'] is True and vc['entity_components_open_concept_hubs'] is True and vc['visible_entity_source_trail'] is True
          assert vc['concept_lenses']==['OVERVIEW','PROFILES','REGIONS','TIME','CO_OCCURRENCE','EVIDENCE']
          assert vc['entity_lenses']==['OVERVIEW','COMPONENTS','MAP','TIME','GRAPH','COMPARE','EVIDENCE']
          assert vc['synchronized_synoptic_lens'] is True
          assert vc['synoptic_lenses']==['MAP','TIME','GRAPH','EVIDENCE']
          assert set(vc['synoptic_shared_state'])=={'SOURCE_FAMILY','TIME_FOCUS','PROFILE_SELECTION'}
          assert vc['synoptic_coordinate_policy']=='SOURCE_BOUNDED_ONLY'
          assert set(vc['three_goal_entrypoints'])=={'LOOK_UP','COMPARE','TRACE_PATTERNS'}
          assert vc['four_step_explainer']==['IDENTIFY','DECOMPOSE','COMPARE','TEST']
          gate=meta['publication_gate']
          assert gate['reference_media_is_evidence'] is False and gate['pattern_candidate_is_causal_relationship'] is False
          assert gate['concept_cooccurrence_is_causal_relationship'] is False and gate['concept_earliest_encoded_window_is_origin'] is False
          assert gate['synoptic_graph_edge_is_historical_relationship'] is False
          assert gate['region_label_implies_coordinate'] is False

          syn=Path('projects/noema/site/synoptic-v15.js').read_text()
          for marker in ['Map · Time · Graph · Evidence','SOURCE_BOUNDED_ONLY' if False else 'Source-bounded coordinates only','shares at least one encoded comparable component','They are not ancestry, influence, historical contact, diffusion or shared theology','Region-only profiles stay unlocated']:
              assert marker in syn, marker

          h=json.load(open('projects/noema/site/research-health.json'))
          p=json.load(open('projects/noema/site/pattern-candidates.json'))
          assert h['metrics']['ontology_dimensions'] >= 16
          assert p['status']=='HYPOTHESIS_GENERATION_ONLY'
          for cohort in p['cohorts']:
              assert 'explicitly PRESENT or explicitly ABSENT' in cohort['null_model']['missingness_rule']
              for r in cohort['candidates']:
                  assert r['n_comparable'] <= r['cohort_profiles'] and 'phylogeny' in r['unresolved_confounders']

          museum=json.load(open('projects/noema/site/museum-reference-media.json'))
          assert museum['policy']['not_evidence'] is True and museum['record_count']>0
          assert all(r['evidence_status']=='NOT_EVIDENCE' for r in museum['records'])
          assert all(r['rights'] in {'PUBLIC_DOMAIN','CC0'} for r in museum['records'])
          commons=json.load(open('projects/noema/data/reference/media-reviewed-v1.json'))
          assert commons['policy']['reference_media_is_evidence'] is False
          assert all(r['evidence_status']=='REFERENCE_ONLY_NOT_EVIDENCE' for r in commons['items'])
          staged=json.load(open('projects/noema/data/candidates/wikimedia-media-candidates.json'))
          assert staged['status']=='PENDING_IDENTITY_AND_RIGHTS_REVIEW'
          assert all(x['decision']=='PENDING_REVIEW' for x in staged['candidates'])
          print('NOEMA v1.5 product-depth + operations contract green')
          PY
