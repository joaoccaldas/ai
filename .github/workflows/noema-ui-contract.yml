name: NOEMA UI and Operations Contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/noema/site/**'
      - 'projects/noema/data/runs/**'
      - 'projects/noema/data/reference/**'
      - 'projects/noema/data/automation-contract-v1.json'
      - 'projects/noema/data/candidates/wikimedia-media-candidates.json'
      - 'projects/noema/schemas/run-manifest-v1.json'
      - 'projects/noema/scripts/build_automation_pulse.py'
      - '.github/workflows/noema-ui-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check browser JavaScript
        run: |
          node --check projects/noema/site/home-v2.js
          node --check projects/noema/site/app-v1.js
          node --check projects/noema/site/cards-v2.js
          node --check projects/noema/site/explore-v18.js
          node --check projects/noema/site/entity-v18.js
          node --check projects/noema/site/shell-v18.js
          node --check projects/noema/site/concept-v1.js
          node --check projects/noema/site/synoptic-v15.js
          node --check projects/noema/site/relationship-v2.js
          node --check projects/noema/site/automation-pulse.js
          node --check projects/noema/site/pattern-v2.js
          node --check projects/noema/site/dashboard-v2.js

      - name: Build and validate automation pulse
        run: |
          python projects/noema/scripts/build_automation_pulse.py --output /tmp/automation-pulse.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('/tmp/automation-pulse.json'))
          contract=json.load(open('projects/noema/data/automation-contract-v1.json'))
          assert d['status']=='OBSERVABILITY_ONLY'
          assert len(contract['tasks'])>=7 and len(d.get('task_health',[]))==len(contract['tasks'])
          assert {x['task_type'] for x in d['task_health']} >= {'GITHUB_DISCOVERY','DAILY_INGEST','DPLACE_BENCHMARK','RELIGION_FEDERATION','WEEKLY_REANALYSIS','MONTHLY_DISCOVERY','MEDIA_DISCOVERY'}
          assert all(x['authority'] and x['next_stage'] and x['writes'] for x in d['task_health'])
          for p in Path('projects/noema/data/runs').glob('*.json'):
              r=json.load(open(p));g=r['epistemic_guards']
              assert r['run_id'] and r['task_type'] and r['status']
              assert g['model_output_is_evidence'] is False
              assert g['unknown_is_absent'] is False
              assert g['similarity_implies_descent'] is False
              assert g['automatic_claim_promotion'] is False
          print('validated manifests', len(list(Path('projects/noema/data/runs').glob('*.json'))), 'and tasks', len(d['task_health']))
          PY

      - name: Validate current product, research and delivery contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          site=Path('projects/noema/site')

          root=(site/'index.html').read_text()
          assert '<title>NOEMA · Religion, Ritual & Belief, Decomposed</title>' in root
          for phrase in [
              'Understand what humans believe, and how beliefs connect.',
              'evidence-backed atlas and comparison engine for religion, ritual, mythology and spiritual practice',
              'href="explore.html">Explore','href="human-meaning-atlas.html">Atlas','href="lineages.html">Analyze',
              'href="library.html">Library','href="research.html">Research','What is NOEMA?',
              '01 · LOOK UP','02 · COMPARE','03 · TRACE PATTERNS',
              '01 · IDENTIFY','02 · DECOMPOSE','03 · COMPARE','04 · TEST','home-v2.js'
          ]:
              assert phrase in root, phrase

          library=(site/'library.html').read_text()
          assert '<title>Library · NOEMA</title>' in library
          assert 'Belief is more than a list of religions.' in library
          assert 'Different evidence types stay different.' in (site/'research.html').read_text()
          research=(site/'research.html').read_text()
          assert '<title>Research · NOEMA</title>' in research
          assert 'Inspect how NOEMA knows what it knows' in research
          assert 'Coverage before confidence.' in research

          explore=(site/'explore.html').read_text()
          explore_js=(site/'explore-v18.js').read_text()
          for marker in ['What do you want to understand?','Map it','Compare it','Analyze connections','shell-v18.js','explore-v18.js']:
              assert marker in explore, marker
          assert 'app-v1.js' not in explore and 'explore-v14.js' not in explore
          assert 'search-index-v18.json' in explore_js
          assert 'concept.html?term=' in explore_js
          assert 'drh-decomposition.json' not in explore_js and 'religion-decomposition.json' not in explore_js

          entity=(site/'entity.html').read_text()
          entity_js=(site/'entity-v18.js').read_text()
          assert 'universal entity workspace' in entity and 'entity-v18.js' in entity and 'shell-v18.js' in entity
          assert 'app-v1.js' not in entity and 'entity-depth-v14.js' not in entity and 'synoptic-v15.js' not in entity
          assert 'drh-decomposition.json' not in entity_js and 'religion-decomposition.json' not in entity_js
          assert "../data/reference/belief-catalog-v1.json" in entity_js and "../ontology/decomposition_v1.json" in entity_js
          assert 'concept.html?term=' in entity_js
          assert 'Reference sources ≠ claim-level evidence' in entity_js
          assert 'reference depiction, not evidence' in entity_js
          assert 'Reference media loads separately from identity data and is never treated as scientific evidence.' in entity_js
          assert 'Entity not found in the public reference catalog.' in entity_js
          assert 'Regional labels are reference context, not an origin claim.' in entity_js
          assert 'A visible reference edge means catalogued association, not historical descent.' in entity_js
          assert 'requestIdleCallback' in entity_js and 'loading="lazy"' in entity_js
          assert "fetch(u)" in entity_js and "cache:'no-store'" not in entity_js and 'cache:"no-store"' not in entity_js

          concept=(site/'concept.html').read_text()
          concept_js=(site/'concept-v1.js').read_text()
          assert 'One idea, many contexts' in concept and 'concept-v1.js' in concept
          assert 'synoptic-v15.js' in concept and 'synoptic-v15.css' in concept
          for marker in ['Profiles','Regions','Time','Co-occurrence','Evidence','earliest encoded record is not an origin date','Co-coded ≠ connected history']:
              assert marker in concept_js, marker

          connections=(site/'lineages.html').read_text()
          assert 'Reference association' in connections and 'Pattern candidate' in connections and 'relationship-v2.js' in connections
          gods=(site/'gods.html').read_text()
          assert 'Every god gets a workspace.' in gods and 'cards-v2.js' in gods

          meta=json.load(open(site/'data.json'))
          assert meta['release']=='v1.7'
          assert meta['status']=='research-preview'
          vc=meta['visual_core']
          assert vc['status']=='v1.8-foundation-on-v1.7-release'
          assert vc['five_area_navigation'] is True
          assert vc['search_first_home'] is True
          assert vc['concept_hubs'] is True
          assert vc['entity_workspace_v2'] is True
          assert vc['synchronized_synoptic_lens'] is True
          assert vc['synoptic_lenses']==['MAP','TIME','GRAPH','EVIDENCE']
          assert set(vc['synoptic_shared_state'])=={'SOURCE_FAMILY','TIME_FOCUS','PROFILE_SELECTION'}
          assert vc['synoptic_coordinate_policy']=='SOURCE_BOUNDED_ONLY'
          assert vc['research_metadata_collapsed_by_default'] is True
          assert vc['accessibility_foundation']=='./foundation-v18.css'
          assert vc['lightweight_shell']=='./shell-v18.js'

          gate=meta['publication_gate']
          for key in [
              'unknown_is_absent','model_synthesis_is_evidence','observation_equals_interpretation',
              'coverage_equals_belief_evidence','current_first_appearance_equals_origin',
              'reference_media_is_evidence','pattern_candidate_is_causal_relationship',
              'reference_association_is_historical_descent','concept_cooccurrence_is_causal_relationship',
              'concept_earliest_encoded_window_is_origin','synoptic_graph_edge_is_historical_relationship',
              'region_label_implies_coordinate','historical_diagnosis_from_resemblance',
              'biomedical_mechanism_equals_cultural_meaning','historical_event_is_monocausal_explanation',
              'supernatural_report_is_metaphysical_proof','supernatural_report_is_diagnosis'
          ]:
              assert gate[key] is False, key
          assert gate['research_preview'] is True and gate['human_review_required_for_claim_publication'] is True

          syn=(site/'synoptic-v15.js').read_text()
          for marker in ['Map · Time · Graph · Evidence','Source-bounded coordinates only','shares at least one encoded comparable component','They are not ancestry, influence, historical contact, diffusion or shared theology','Region-only profiles stay unlocated']:
              assert marker in syn, marker

          h=json.load(open(site/'research-health.json'))
          p=json.load(open(site/'pattern-candidates.json'))
          assert h['metrics']['ontology_dimensions'] >= 16
          assert p['status']=='HYPOTHESIS_GENERATION_ONLY'
          for cohort in p['cohorts']:
              assert 'explicitly PRESENT or explicitly ABSENT' in cohort['null_model']['missingness_rule']
              for r in cohort['candidates']:
                  assert r['n_comparable'] <= r['cohort_profiles']
                  assert 'phylogeny' in r['unresolved_confounders']

          museum=json.load(open(site/'museum-reference-media.json'))
          assert museum['policy']['not_evidence'] is True and museum['record_count']>0
          assert all(r['evidence_status']=='NOT_EVIDENCE' for r in museum['records'])
          assert all(r['rights'] in {'PUBLIC_DOMAIN','CC0'} for r in museum['records'])
          commons=json.load(open('projects/noema/data/reference/media-reviewed-v1.json'))
          assert commons['policy']['reference_media_is_evidence'] is False
          assert all(r['evidence_status']=='REFERENCE_ONLY_NOT_EVIDENCE' for r in commons['items'])
          staged=json.load(open('projects/noema/data/candidates/wikimedia-media-candidates.json'))
          assert staged['status']=='PENDING_IDENTITY_AND_RIGHTS_REVIEW'
          assert all(x['decision']=='PENDING_REVIEW' for x in staged['candidates'])

          print('NOEMA current product + research + v1.8.1 delivery contract green')
          PY
