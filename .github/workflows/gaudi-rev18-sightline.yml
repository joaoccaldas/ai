name: Gaudi Rev18 F3 Sightline

on:
  push:
    branches: [gaudi-rev18-sightline-20261007]
    paths:
      - '.github/workflows/gaudi-rev18-sightline.yml'
      - 'projects/gaudi-nexus/scripts/analyze_rev18_f3_sightline.py'
      - 'projects/gaudi-nexus/scripts/build_rev18_site_truth_candidate.py'
  workflow_dispatch:

jobs:
  sightline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender 5.2
        run: |
          curl -fsSL 'https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz' -o blender.tar.xz
          tar -xf blender.tar.xz
          echo "$PWD/blender-5.2.0-linux-x64" >> "$GITHUB_PATH"

      - name: Install headless render runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1

      - name: Download checksum-pinned inputs
        run: |
          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_31Vx2ThP2hxeA9WUkkpCfbJLaeb/57590020-3bff-4a29-89c7-9bdf05a130c6.blend' -o rev15.blend
          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_31Vx2ThP2hxeA9WUkkpCfbJLaeb/eaef5ac9-3706-45dc-809e-73c0b8b4c864.glb' -o municipal.glb
          echo 'cc1179cd2c2b379f954cbc55eb995f88d0786e08b37abfaca7e71417c4b1d494  rev15.blend' | sha256sum -c -
          echo 'f5c324141f1328666c528810b8212c3152f2b6970bd780c6bb4516ee8c3e3f1c  municipal.glb' | sha256sum -c -

      - name: Rebuild semantically identical Rev18 candidate
        run: |
          blender --background rev15.blend --python projects/gaudi-nexus/scripts/build_rev18_site_truth_candidate.py
          sha256sum rev18_site_truth_candidate.blend > rev18_rebuild_sha256.txt
          python - <<'PY'
          import json
          r=json.load(open('rev18_site_truth_report.json'))
          assert r['status']=='REV18_SITE_TRUTH_CANDIDATE_BUILT_NOT_PROMOTED'
          assert r['base_rev15_sha256']=='cc1179cd2c2b379f954cbc55eb995f88d0786e08b37abfaca7e71417c4b1d494'
          assert r['municipal_glb_sha256']=='f5c324141f1328666c528810b8212c3152f2b6970bd780c6bb4516ee8c3e3f1c'
          assert r['municipal_collection']=='00_SITE_MUNICIPAL_IMPORTED'
          assert r['total_objects']==1603
          assert r['alignment']['translation_m']==[13.359293125672881,108.63406337943947,0]
          assert r['hero']['camera']=='A_HERO_MUNICIPAL_F3'
          assert r['hero']['position']==[-15.0,42.0,1.56]
          assert r['hero']['lens_mm']==32
          PY

      - name: Run F3 sightline diagnostic
        run: |
          blender --background rev18_site_truth_candidate.blend --python projects/gaudi-nexus/scripts/analyze_rev18_f3_sightline.py
          test -s rev18_f3_sightline_report.json
          cat rev18_f3_sightline_report.json
          python - <<'PY'
          import json
          r=json.load(open('rev18_f3_sightline_report.json'))
          assert r['status']=='REV18_F3_SIGHTLINE_DIAGNOSTIC'
          assert r['camera']=='A_HERO_MUNICIPAL_F3'
          assert r['target_window']['sample_count']==9
          # Fail closed only on malformed evidence, not on a blocked sightline.
          # The architectural verdict is recorded for review rather than hidden by CI.
          assert r['verdict'] in ('CLEAR_TO_TARGET_POINT','BLOCKED_BEFORE_TARGET')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: gaudi-rev18-f3-sightline
          path: |
            rev18_f3_sightline_report.json
            rev18_rebuild_sha256.txt
            rev18_site_truth_report.json
          retention-days: 30
