name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify cinematic Studio deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          target="${PAGE_URL}studio/?build=${BUILD_SHA}"
          echo "Verifying ${target}"
          for attempt in $(seq 1 24); do
            body=$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              "$target" || true)
            if printf '%s' "$body" | grep -q 'Imagine'; then
              echo "Cinematic Studio is live on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: deployment not visible yet; retrying in 10 seconds."
            sleep 10
          done
          echo 'The deployed Studio page did not contain the cinematic hero after four minutes.' >&2
          exit 1
