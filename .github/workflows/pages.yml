name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and normalize Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )

          config=$(curl --fail --silent --show-error "${headers[@]}" "$api")
          build_type=$(printf '%s' "$config" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build_type", "unknown"))')
          source_branch=$(printf '%s' "$config" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("source") or {}).get("branch", "none"))')
          source_path=$(printf '%s' "$config" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("source") or {}).get("path", "none"))')
          echo "Pages before: build_type=${build_type}, source=${source_branch}${source_path}"

          if [ "$build_type" != "workflow" ]; then
            echo 'Pages is not using GitHub Actions. Attempting to switch build_type to workflow.'
            curl --fail --silent --show-error \
              --request PUT \
              "${headers[@]}" \
              "$api" \
              --data '{"build_type":"workflow"}' >/dev/null
            config=$(curl --fail --silent --show-error "${headers[@]}" "$api")
            build_type=$(printf '%s' "$config" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build_type", "unknown"))')
            source_branch=$(printf '%s' "$config" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("source") or {}).get("branch", "none"))')
            source_path=$(printf '%s' "$config" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("source") or {}).get("path", "none"))')
          fi

          description="build=${build_type}; source=${source_branch}${source_path}"
          description=${description:0:139}
          payload=$(python3 - "$description" <<'PY'
          import json, sys
          print(json.dumps({
              "state": "success",
              "context": "pages-config",
              "description": sys.argv[1]
          }))
          PY
          )
          curl --fail --silent --show-error \
            --request POST \
            "${headers[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null
          echo "Pages after: ${description}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp exact deployment identity
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "sha": os.environ["GITHUB_SHA"],
              "deployed_at": datetime.now(timezone.utc).isoformat(),
              "experience": "studio-cinematic-v2"
          }
          with open("studio/deployment.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, separators=(",", ":"))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact canonical deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          base="https://${OWNER}.github.io/${REPOSITORY}"
          marker="${base}/studio/deployment.json?build=${EXPECTED_SHA}"
          page="${base}/studio/?build=${EXPECTED_SHA}"

          verified=0
          for attempt in $(seq 1 30); do
            marker_body=$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, must-revalidate' \
              --header 'Pragma: no-cache' \
              "$marker" || true)
            page_body=$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, must-revalidate' \
              --header 'Pragma: no-cache' \
              "$page" || true)
            marker_sha=$(printf '%s' "$marker_body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))' 2>/dev/null || true)

            if [ "$marker_sha" = "$EXPECTED_SHA" ] \
              && printf '%s' "$marker_body" | grep -q 'studio-cinematic-v2' \
              && printf '%s' "$page_body" | grep -q 'Imagine' \
              && printf '%s' "$page_body" | grep -q 'plates/lobby.js'; then
              verified=1
              echo "Exact cinematic deployment verified on attempt ${attempt}."
              break
            fi

            echo "Attempt ${attempt}: expected ${EXPECTED_SHA}; observed ${marker_sha:-missing}."
            sleep 10
          done

          test "$verified" = "1"
          sleep 30
          final_sha=$(curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache, no-store, must-revalidate' \
            --header 'Pragma: no-cache' \
            "$marker" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))')
          test "$final_sha" = "$EXPECTED_SHA"
          echo "Canonical deployment remained stable at ${final_sha}."

      - name: Mark canonical verification success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"studio-live","description":"Canonical Pages serves this exact cinematic commit"}'

      - name: Mark canonical verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"studio-live","description":"Canonical Pages is not serving this commit"}'
