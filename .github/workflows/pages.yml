name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stamp exact deployment identity
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          with open("studio/deployment.json", "w", encoding="utf-8") as f:
              json.dump({
                  "sha": os.environ["GITHUB_SHA"],
                  "deployed_at": datetime.now(timezone.utc).isoformat(),
                  "experience": "studio-cinematic-v2"
              }, f, separators=(",", ":"))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact canonical deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          base="https://${OWNER}.github.io/${REPOSITORY}"
          marker="${base}/studio/deployment.json?build=${EXPECTED_SHA}"
          page="${base}/studio/?build=${EXPECTED_SHA}"

          verified=0
          for attempt in $(seq 1 30); do
            marker_body=$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, must-revalidate' \
              --header 'Pragma: no-cache' \
              "$marker" || true)
            page_body=$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, must-revalidate' \
              --header 'Pragma: no-cache' \
              "$page" || true)
            marker_sha=$(printf '%s' "$marker_body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))' 2>/dev/null || true)

            if [ "$marker_sha" = "$EXPECTED_SHA" ] \
              && printf '%s' "$marker_body" | grep -q 'studio-cinematic-v2' \
              && printf '%s' "$page_body" | grep -q 'Imagine' \
              && printf '%s' "$page_body" | grep -q 'plates/lobby.js'; then
              verified=1
              echo "Exact cinematic deployment verified on attempt ${attempt}."
              break
            fi

            echo "Attempt ${attempt}: expected ${EXPECTED_SHA}; observed ${marker_sha:-missing}."
            sleep 10
          done

          test "$verified" = "1"
          sleep 30
          final_sha=$(curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache, no-store, must-revalidate' \
            --header 'Pragma: no-cache' \
            "$marker" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))')
          test "$final_sha" = "$EXPECTED_SHA"
          echo "Canonical deployment remained stable at ${final_sha}."

      - name: Publish workflow result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Canonical Pages serves this exact cinematic commit"
          else
            state="failure"
            description="Pages deployment failed; open the linked workflow run"
          fi
          payload=$(python3 - "$state" "$description" "$RUN_URL" <<'PY'
          import json, sys
          print(json.dumps({
              "state": sys.argv[1],
              "context": "studio-live",
              "description": sys.argv[2],
              "target_url": sys.argv[3]
          }))
          PY
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
