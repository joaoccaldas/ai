name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify cinematic Studio deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          target="${PAGE_URL}studio/?build=${BUILD_SHA}"
          echo "Verifying ${target}"
          for attempt in $(seq 1 24); do
            body=$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              "$target" || true)
            if printf '%s' "$body" | grep -q 'Imagine'; then
              echo "Cinematic Studio is live on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: deployment not visible yet; retrying in 10 seconds."
            sleep 10
          done
          echo 'The deployed Studio page did not contain the cinematic hero after four minutes.' >&2
          exit 1

      - name: Mark live verification success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"studio-live","description":"Cinematic Studio is deployed and verified"}'

      - name: Mark live verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"studio-live","description":"Cinematic Studio deployment verification failed"}'
