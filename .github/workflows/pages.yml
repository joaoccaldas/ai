name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages source without blocking deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth="Authorization: Bearer ${GH_TOKEN}"
          accept='Accept: application/vnd.github+json'
          version='X-GitHub-Api-Version: 2022-11-28'

          http_code=$(curl --silent --show-error \
            --output /tmp/pages-config.json \
            --write-out '%{http_code}' \
            --header "$auth" --header "$accept" --header "$version" \
            "$api")

          build_type="unavailable"
          source_branch="unknown"
          source_path="unknown"
          switch_code="not-attempted"

          if [ "$http_code" = "200" ]; then
            build_type=$(python3 -c 'import json; print(json.load(open("/tmp/pages-config.json")).get("build_type", "unknown"))')
            source_branch=$(python3 -c 'import json; print((json.load(open("/tmp/pages-config.json")).get("source") or {}).get("branch", "none"))')
            source_path=$(python3 -c 'import json; print((json.load(open("/tmp/pages-config.json")).get("source") or {}).get("path", "none"))')

            if [ "$build_type" != "workflow" ]; then
              switch_code=$(curl --silent --show-error \
                --output /tmp/pages-switch.json \
                --write-out '%{http_code}' \
                --request PUT \
                --header "$auth" --header "$accept" --header "$version" \
                "$api" \
                --data '{"build_type":"workflow"}')
              if [ "$switch_code" = "204" ] || [ "$switch_code" = "200" ]; then
                build_type="workflow"
              fi
            fi
          fi

          description="api=${http_code}; build=${build_type}; source=${source_branch}${source_path}; switch=${switch_code}"
          description=${description:0:139}
          payload=$(python3 - "$description" <<'PY'
          import json, sys
          print(json.dumps({"state":"success","context":"pages-config","description":sys.argv[1]}))
          PY
          )
          curl --silent --show-error \
            --request POST \
            --header "$auth" --header "$accept" --header "$version" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null || true
          echo "$description"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp exact deployment identity
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "sha": os.environ["GITHUB_SHA"],
              "deployed_at": datetime.now(timezone.utc).isoformat(),
              "experience": "studio-cinematic-v2"
          }
          with open("studio/deployment.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, separators=(",", ":"))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact canonical deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          base="https://${OWNER}.github.io/${REPOSITORY}"
          marker="${base}/studio/deployment.json?build=${EXPECTED_SHA}"
          page="${base}/studio/?build=${EXPECTED_SHA}"

          verified=0
          for attempt in $(seq 1 30); do
            marker_body=$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, must-revalidate' \
              --header 'Pragma: no-cache' \
              "$marker" || true)
            page_body=$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, must-revalidate' \
              --header 'Pragma: no-cache' \
              "$page" || true)
            marker_sha=$(printf '%s' "$marker_body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))' 2>/dev/null || true)

            if [ "$marker_sha" = "$EXPECTED_SHA" ] \
              && printf '%s' "$marker_body" | grep -q 'studio-cinematic-v2' \
              && printf '%s' "$page_body" | grep -q 'Imagine' \
              && printf '%s' "$page_body" | grep -q 'plates/lobby.js'; then
              verified=1
              echo "Exact cinematic deployment verified on attempt ${attempt}."
              break
            fi

            echo "Attempt ${attempt}: expected ${EXPECTED_SHA}; observed ${marker_sha:-missing}."
            sleep 10
          done

          test "$verified" = "1"
          sleep 30
          final_sha=$(curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache, no-store, must-revalidate' \
            --header 'Pragma: no-cache' \
            "$marker" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))')
          test "$final_sha" = "$EXPECTED_SHA"
          echo "Canonical deployment remained stable at ${final_sha}."

      - name: Mark canonical verification success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"studio-live","description":"Canonical Pages serves this exact cinematic commit"}'

      - name: Mark canonical verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"studio-live","description":"Canonical Pages is not serving this commit"}'
