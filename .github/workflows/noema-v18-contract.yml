name: NOEMA v1.8 Source Breadth Contract

on:
  push:
    paths:
      - 'projects/noema/src/noema/source_dependence.py'
      - 'projects/noema/scripts/build_source_dependence.py'
      - 'projects/noema/data/reference/source-fingerprints-v1.json'
      - 'projects/noema/site/source-dependence.json'
      - 'projects/noema/tests/test_source_dependence.py'
      - '.github/workflows/noema-v18-contract.yml'
  pull_request:
    paths:
      - 'projects/noema/src/noema/source_dependence.py'
      - 'projects/noema/scripts/build_source_dependence.py'
      - 'projects/noema/data/reference/source-fingerprints-v1.json'
      - 'projects/noema/site/source-dependence.json'
      - 'projects/noema/tests/test_source_dependence.py'
      - '.github/workflows/noema-v18-contract.yml'

jobs:
  source-dependence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/noema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Regenerate source-dependence projection
        run: |
          python scripts/build_source_dependence.py --manifest data/reference/source-fingerprints-v1.json --output /tmp/source-dependence.json
          python -m json.tool /tmp/source-dependence.json >/dev/null
          diff -u site/source-dependence.json /tmp/source-dependence.json
      - name: Validate epistemic contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('site/source-dependence.json'))
          assert x['status']=='RESEARCH_PREVIEW'
          assert x['counts']['sources']>=7
          assert x['counts']['dependency_edges']>=1
          assert x['guardrails']['author_overlap_is_dependence'] is False
          assert x['guardrails']['shared_dataset_means_same_conclusion'] is False
          assert any(e['dependency_type']=='SHARED_DATASET' for e in x['edges'])
          assert any(len(group)>1 for group in x['independence_groups'])
          assert any('not proof of independence' in n for n in x['notes'])
          PY
      - name: Run source dependence tests
        run: pytest tests/test_source_dependence.py
