name: Legacy Pages Build and Public Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild legacy Pages and verify public Studio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2026-03-10'
          )
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          public_page="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/studio/?build=${GITHUB_SHA}"

          site=$(curl --fail --silent --show-error "${headers[@]}" "$api")
          build_type=$(printf '%s' "$site" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build_type", "unknown"))')
          branch=$(printf '%s' "$site" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("source") or {}).get("branch", "none"))')
          path=$(printf '%s' "$site" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("source") or {}).get("path", "none"))')
          echo "Pages mode: ${build_type}; source=${branch}${path}"

          request_code=$(curl --silent --show-error \
            --output /tmp/build-request.json \
            --write-out '%{http_code}' \
            --request POST \
            "${headers[@]}" \
            "$api/builds")
          echo "Legacy build request HTTP ${request_code}"
          cat /tmp/build-request.json || true
          echo

          latest_status="unknown"
          latest_commit="unknown"
          latest_error="unknown"
          for attempt in $(seq 1 60); do
            latest=$(curl --fail --silent --show-error "${headers[@]}" "$api/builds/latest")
            latest_status=$(printf '%s' "$latest" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", "unknown"))')
            latest_commit=$(printf '%s' "$latest" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit", "unknown"))')
            latest_error=$(printf '%s' "$latest" | python3 -c 'import json,sys; e=json.load(sys.stdin).get("error") or {}; print(e.get("message") or "none")')
            echo "Build attempt ${attempt}: status=${latest_status}; commit=${latest_commit}; error=${latest_error}"
            if [ "$latest_status" = "built" ] && [ "$latest_commit" = "$GITHUB_SHA" ]; then
              break
            fi
            if [ "$latest_status" = "errored" ]; then
              break
            fi
            sleep 5
          done

          public_ok=0
          for attempt in $(seq 1 36); do
            body=$(curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, must-revalidate' \
              --header 'Pragma: no-cache' \
              "$public_page" || true)
            if printf '%s' "$body" | grep -q 'Imagine' \
              && printf '%s' "$body" | grep -q 'gallery-shell.css?v=7' \
              && printf '%s' "$body" | grep -q 'plates/lobby.js'; then
              public_ok=1
              echo "Canonical cinematic Studio verified on attempt ${attempt}."
              break
            fi
            echo "Public attempt ${attempt}: canonical page is not cinematic yet."
            sleep 5
          done

          state="success"
          description="legacy=${latest_status}; commit=${latest_commit:0:7}; public=${public_ok}"
          if [ "$latest_status" != "built" ] || [ "$latest_commit" != "$GITHUB_SHA" ] || [ "$public_ok" != "1" ]; then
            state="failure"
          fi
          payload=$(python3 - "$state" "$description" "$run_url" <<'PY'
          import json, sys
          print(json.dumps({
              "state": sys.argv[1],
              "context": "studio-public",
              "description": sys.argv[2],
              "target_url": sys.argv[3]
          }))
          PY
          )
          curl --fail --silent --show-error \
            --request POST \
            "${headers[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null

          echo "SUMMARY: ${description}"
          test "$state" = "success"
