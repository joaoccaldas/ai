name: Legacy Pages Build and Public Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rebuild legacy Pages and verify public Effects V2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(--header "Authorization: Bearer ${GH_TOKEN}" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2026-03-10')
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          public_root="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          request_code=$(curl -sS -o /tmp/build.json -w '%{http_code}' -X POST "${headers[@]}" "$api/builds")
          echo "Legacy build request HTTP ${request_code}"
          latest_status=unknown; latest_commit=unknown
          for attempt in $(seq 1 60); do
            latest=$(curl -fsS "${headers[@]}" "$api/builds/latest")
            latest_status=$(printf '%s' "$latest"|python3 -c 'import json,sys;print(json.load(sys.stdin).get("status","unknown"))')
            latest_commit=$(printf '%s' "$latest"|python3 -c 'import json,sys;print(json.load(sys.stdin).get("commit","unknown"))')
            echo "Build ${attempt}: ${latest_status} ${latest_commit}"
            [ "$latest_status" = built ] && [ "$latest_commit" = "$GITHUB_SHA" ] && break
            sleep 5
          done
          demos=(cursor-light cutaway-reveal day-night-morph ambient-spill world-transition camera-depth architectural-type theatre-light bioluminescence interactive-hud)
          verified=0
          for attempt in $(seq 1 48); do
            verified=0
            index=$(curl -fsSL -H 'Cache-Control: no-cache' "${public_root}/studio/effects/?build=${GITHUB_SHA}" || true)
            if printf '%s' "$index"|grep -q 'effects.js?v=2'; then
              for demo in "${demos[@]}"; do
                body=$(curl -fsSL -H 'Cache-Control: no-cache' "${public_root}/studio/effects/${demo}/?build=${GITHUB_SHA}" || true)
                printf '%s' "$body"|grep -q 'effects.js?v=2' && verified=$((verified+1))
              done
            fi
            [ "$verified" = 10 ] && break
            echo "Public ${attempt}: ${verified}/10 V2 routes"; sleep 5
          done
          state=success
          [ "$latest_status" = built ] && [ "$latest_commit" = "$GITHUB_SHA" ] && [ "$verified" = 10 ] || state=failure
          description="legacy=${latest_status}; commit=${latest_commit:0:7}; effects-v2=${verified}/10"
          payload=$(python3 - "$state" "$description" "$run_url" <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'studio-public','description':sys.argv[2],'target_url':sys.argv[3]}))
          PY
          )
          curl -fsS -X POST "${headers[@]}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "$payload" >/dev/null
          echo "$description"
          test "$state" = success
