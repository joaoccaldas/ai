name: Pages Configuration Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages configuration
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          http_code=$(curl --silent --show-error \
            --output /tmp/pages.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")

          echo "HTTP ${http_code}"
          cat /tmp/pages.json || true
          echo

          build_type="unavailable"
          branch="unknown"
          path="unknown"
          status="unknown"
          html_url="unknown"
          if [ "$http_code" = "200" ]; then
            build_type=$(python3 -c 'import json; d=json.load(open("/tmp/pages.json")); print(d.get("build_type", "unknown"))')
            branch=$(python3 -c 'import json; d=json.load(open("/tmp/pages.json")); print((d.get("source") or {}).get("branch", "none"))')
            path=$(python3 -c 'import json; d=json.load(open("/tmp/pages.json")); print((d.get("source") or {}).get("path", "none"))')
            status=$(python3 -c 'import json; d=json.load(open("/tmp/pages.json")); print(d.get("status", "unknown"))')
            html_url=$(python3 -c 'import json; d=json.load(open("/tmp/pages.json")); print(d.get("html_url", "unknown"))')
          fi

          description="http=${http_code}; build=${build_type}; source=${branch}${path}; status=${status}"
          description=${description:0:139}
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(python3 - "$description" "$run_url" <<'PY'
          import json, sys
          print(json.dumps({
              "state": "success",
              "context": "pages-diagnostic",
              "description": sys.argv[1],
              "target_url": sys.argv[2]
          }))
          PY
          )
          curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/dev/null || true

          echo "SUMMARY: ${description}"
          echo "URL: ${html_url}"
