name: NOEMA v1.8.2 Delivery Integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/noema/scripts/build_search_index_v18.py'
      - 'projects/noema/scripts/build_compare_index_v18.py'
      - 'projects/noema/tests/test_delivery_integrity_v18.py'
      - 'projects/noema/site/explore.html'
      - 'projects/noema/site/explore-v18.js'
      - 'projects/noema/site/entity.html'
      - 'projects/noema/site/entity-v18.js'
      - 'projects/noema/site/compare.html'
      - 'projects/noema/site/compare-v18.js'
      - 'projects/noema/site/shell-v18.js'
      - 'projects/noema/site/foundation-v18.css'
      - 'projects/noema/data/reference/belief-catalog-v1.json'
      - 'projects/noema/data/reference/media-reviewed-v1.json'
      - 'projects/noema/ontology/decomposition_v1.json'
      - 'projects/noema/site/museum-reference-media.json'
      - 'projects/noema/site/religion-decomposition.json'
      - 'projects/noema/site/drh-decomposition.json'
      - 'projects/noema/docs/V1_8_1_DELIVERY_INTEGRITY.md'
      - '.github/workflows/noema-delivery-integrity-v18.yml'

permissions:
  contents: write
  pages: read

concurrency:
  group: noema-delivery-integrity-v18
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Build compact browser projections
        run: |
          python projects/noema/scripts/build_search_index_v18.py
          python projects/noema/scripts/build_compare_index_v18.py

      - name: Validate projection contracts and payload budgets
        run: |
          set -eu
          python - <<'PY'
          import json
          from pathlib import Path

          search=Path('projects/noema/site/search-index-v18.json')
          s=json.loads(search.read_text(encoding='utf-8'))
          assert s['projection']=='NOEMA_COMPACT_SEARCH_V18'
          assert s['counts']['records'] >= 20, s['counts']
          assert len(s.get('sources', [])) >= 3
          assert len(s.get('source_fingerprint','')) == 64
          search_size=search.stat().st_size
          assert search_size <= 2_621_440, f'compact search index exceeded 2.5 MiB budget: {search_size}'

          compare=Path('projects/noema/site/compare-index-v18.json')
          c=json.loads(compare.read_text(encoding='utf-8'))
          assert c['projection']=='NOEMA_COMPACT_COMPARE_V18'
          assert c['counts']['records'] >= 1000, c['counts']
          assert c['counts']['source_families'] == 3, c['counts']
          assert c['counts']['comparable_records'] > 100, c['counts']
          assert c['counts']['dimensions'] >= 10, c['counts']
          assert len(c.get('source_fingerprint','')) == 64
          assert c['mapping_rules']['unknown_or_uncoded']=='render explicitly; never infer absence'
          compare_size=compare.stat().st_size
          assert compare_size <= 5_242_880, f'compact compare index exceeded 5 MiB budget: {compare_size}'
          assert all('sources' not in r and 'assertions' not in r for r in c['records'])

          print({
            'search_records':s['counts']['records'],
            'search_bytes':search_size,
            'compare_records':c['counts']['records'],
            'compare_comparable':c['counts']['comparable_records'],
            'compare_dimensions':c['counts']['dimensions'],
            'compare_bytes':compare_size,
          })
          PY
          ! grep -q 'app-v1.js' projects/noema/site/explore.html
          ! grep -q 'drh-decomposition.json' projects/noema/site/explore.html
          ! grep -q 'religion-decomposition.json' projects/noema/site/explore.html
          ! grep -q 'app-v1.js' projects/noema/site/entity.html
          ! grep -q 'entity-depth-v14.js' projects/noema/site/entity.html
          ! grep -q 'drh-decomposition.json' projects/noema/site/entity-v18.js
          ! grep -q 'religion-decomposition.json' projects/noema/site/entity-v18.js
          ! grep -q 'app-v1.js' projects/noema/site/compare.html
          ! grep -q 'drh-decomposition.json' projects/noema/site/compare-v18.js
          ! grep -q 'religion-decomposition.json' projects/noema/site/compare-v18.js

      - name: Run v1.8 delivery regression tests
        run: python -m pytest -q projects/noema/tests/test_delivery_integrity_v18.py

      - name: JavaScript syntax smoke checks
        run: |
          node --check projects/noema/site/explore-v18.js
          node --check projects/noema/site/entity-v18.js
          node --check projects/noema/site/compare-v18.js
          node --check projects/noema/site/shell-v18.js

      - name: Commit generated projections when missing or changed
        id: commit
        run: |
          set -euo pipefail
          artifacts=(
            'projects/noema/site/search-index-v18.json'
            'projects/noema/site/compare-index-v18.json'
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for artifact in "${artifacts[@]}"; do
            git add -f "$artifact"
          done
          if git diff --cached --quiet -- "${artifacts[@]}"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Compact projections are tracked and current.'
            exit 0
          fi
          git commit -m 'NOEMA v1.8.2: publish compact browser projections'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Wait for matching GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=$(git rev-parse HEAD)
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest"
          echo "Waiting for Pages build of ${expected}"
          matched=0
          for attempt in $(seq 1 120); do
            body=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "$api" || true)
            status=$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status","unavailable"))' 2>/dev/null || echo unavailable)
            commit=$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("commit","unknown"))' 2>/dev/null || echo unknown)
            echo "Pages attempt ${attempt}: status=${status}; commit=${commit}"
            if [ "$status" = "built" ] && [ "$commit" = "$expected" ]; then
              matched=1
              break
            fi
            if [ "$status" = "errored" ] && [ "$commit" = "$expected" ]; then
              echo "Matching Pages build errored."
              break
            fi
            sleep 5
          done
          test "$matched" = 1

      - name: Verify deployed GitHub Pages contract
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          base="https://${OWNER}.github.io/${REPO}/projects/noema/site"
          echo "NOEMA_PUBLIC_URL=${base}/"

          fetch_asset() {
            name="$1"; url="$2"; out="/tmp/noema-${name}"
            code=$(curl --silent --show-error --location \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              -H 'Pragma: no-cache' \
              -o "$out" -w '%{http_code}' "$url" || true)
            printf '%s' "$code"
          }

          ok=0
          for attempt in $(seq 1 60); do
            nonce="$(git rev-parse HEAD)-${attempt}"
            c_explore=$(fetch_asset explore "${base}/explore.html?delivery=${nonce}")
            c_entity=$(fetch_asset entity "${base}/entity.html?id=GOD-ODIN&delivery=${nonce}")
            c_compare=$(fetch_asset compare "${base}/compare.html?a=GOD-ODIN&b=GOD-ZEUS&delivery=${nonce}")
            c_searchindex=$(fetch_asset searchindex "${base}/search-index-v18.json?delivery=${nonce}")
            c_compareindex=$(fetch_asset compareindex "${base}/compare-index-v18.json?delivery=${nonce}")
            c_shell=$(fetch_asset shell "${base}/shell-v18.js?delivery=${nonce}")
            c_entityjs=$(fetch_asset entityjs "${base}/entity-v18.js?delivery=${nonce}")
            c_comparejs=$(fetch_asset comparejs "${base}/compare-v18.js?delivery=${nonce}")
            echo "Public attempt ${attempt}: explore=${c_explore} entity=${c_entity} compare=${c_compare} searchindex=${c_searchindex} compareindex=${c_compareindex} shell=${c_shell} entityjs=${c_entityjs} comparejs=${c_comparejs}"

            if [ "$c_explore" = 200 ] && [ "$c_entity" = 200 ] && [ "$c_compare" = 200 ] \
              && [ "$c_searchindex" = 200 ] && [ "$c_compareindex" = 200 ] && [ "$c_shell" = 200 ] \
              && [ "$c_entityjs" = 200 ] && [ "$c_comparejs" = 200 ] \
              && grep -q 'explore-v18.js' /tmp/noema-explore \
              && ! grep -q 'app-v1.js' /tmp/noema-explore \
              && grep -q 'entity-v18.js' /tmp/noema-entity \
              && ! grep -q 'app-v1.js' /tmp/noema-entity \
              && grep -q 'compare-v18.js' /tmp/noema-compare \
              && ! grep -q 'app-v1.js' /tmp/noema-compare \
              && grep -q 'requestIdleCallback' /tmp/noema-entityjs \
              && ! grep -q 'drh-decomposition.json' /tmp/noema-entityjs \
              && grep -q 'NOEMA_COMPACT_SEARCH_V18' /tmp/noema-searchindex \
              && grep -q 'NOEMA_COMPACT_COMPARE_V18' /tmp/noema-compareindex \
              && grep -q 'unknown / uncoded' /tmp/noema-comparejs \
              && ! grep -q 'drh-decomposition.json' /tmp/noema-comparejs \
              && grep -q 'Skip to main content' /tmp/noema-shell; then
              ok=1
              echo "NOEMA v1.8.2 Explore + Entity + Compare delivery contract is publicly visible (attempt ${attempt})."
              break
            fi
            sleep 3
          done
          test "$ok" = 1
