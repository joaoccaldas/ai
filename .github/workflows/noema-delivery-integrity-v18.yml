name: NOEMA v1.8.1 Delivery Integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/noema/scripts/build_search_index_v18.py'
      - 'projects/noema/tests/test_delivery_integrity_v18.py'
      - 'projects/noema/site/explore.html'
      - 'projects/noema/site/explore-v18.js'
      - 'projects/noema/site/entity.html'
      - 'projects/noema/site/entity-v18.js'
      - 'projects/noema/site/shell-v18.js'
      - 'projects/noema/site/foundation-v18.css'
      - 'projects/noema/data/reference/belief-catalog-v1.json'
      - 'projects/noema/data/reference/media-reviewed-v1.json'
      - 'projects/noema/ontology/decomposition_v1.json'
      - 'projects/noema/site/museum-reference-media.json'
      - 'projects/noema/site/religion-decomposition.json'
      - 'projects/noema/site/drh-decomposition.json'
      - 'projects/noema/docs/V1_8_1_DELIVERY_INTEGRITY.md'
      - '.github/workflows/noema-delivery-integrity-v18.yml'

permissions:
  contents: write
  pages: read

concurrency:
  group: noema-delivery-integrity-v18
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Build compact search projection
        run: python projects/noema/scripts/build_search_index_v18.py

      - name: Validate projection contract and payload budget
        run: |
          set -eu
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/noema/site/search-index-v18.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['projection']=='NOEMA_COMPACT_SEARCH_V18'
          assert d['counts']['records'] >= 20, d['counts']
          assert len(d.get('sources', [])) >= 3
          size=p.stat().st_size
          assert size <= 2_621_440, f'compact search index exceeded 2.5 MiB budget: {size}'
          print({'records':d['counts']['records'],'source_families':d['counts']['source_families'],'bytes':size})
          PY
          ! grep -q 'app-v1.js' projects/noema/site/explore.html
          ! grep -q 'drh-decomposition.json' projects/noema/site/explore.html
          ! grep -q 'religion-decomposition.json' projects/noema/site/explore.html
          ! grep -q 'app-v1.js' projects/noema/site/entity.html
          ! grep -q 'entity-depth-v14.js' projects/noema/site/entity.html
          ! grep -q 'drh-decomposition.json' projects/noema/site/entity-v18.js
          ! grep -q 'religion-decomposition.json' projects/noema/site/entity-v18.js

      - name: Run v1.8.1 regression tests
        run: python -m pytest -q projects/noema/tests/test_delivery_integrity_v18.py

      - name: JavaScript syntax smoke checks
        run: |
          node --check projects/noema/site/explore-v18.js
          node --check projects/noema/site/entity-v18.js
          node --check projects/noema/site/shell-v18.js

      - name: Commit generated projection when missing or changed
        id: commit
        run: |
          set -euo pipefail
          artifact='projects/noema/site/search-index-v18.json'
          tracked=0
          if git ls-files --error-unmatch "$artifact" >/dev/null 2>&1; then
            tracked=1
          fi
          if [ "$tracked" = 1 ] && git diff --quiet -- "$artifact"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Compact search projection is tracked and current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The site projection may match a broad generated-file ignore rule. It is a
          # deliberate public build artifact, so force-add it when first introduced.
          git add -f "$artifact"
          if git diff --cached --quiet -- "$artifact"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No staged projection change after add.'
            exit 0
          fi
          git commit -m 'NOEMA v1.8.1: publish compact search projection'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Wait for matching GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=$(git rev-parse HEAD)
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest"
          echo "Waiting for Pages build of ${expected}"
          matched=0
          for attempt in $(seq 1 120); do
            body=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "$api" || true)
            status=$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status","unavailable"))' 2>/dev/null || echo unavailable)
            commit=$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("commit","unknown"))' 2>/dev/null || echo unknown)
            echo "Pages attempt ${attempt}: status=${status}; commit=${commit}"
            if [ "$status" = "built" ] && [ "$commit" = "$expected" ]; then
              matched=1
              break
            fi
            if [ "$status" = "errored" ] && [ "$commit" = "$expected" ]; then
              echo "Matching Pages build errored."
              break
            fi
            sleep 5
          done
          test "$matched" = 1

      - name: Verify deployed GitHub Pages contract
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          base="https://${OWNER}.github.io/${REPO}/projects/noema/site"
          echo "NOEMA_PUBLIC_URL=${base}/"

          fetch_asset() {
            name="$1"; url="$2"; out="/tmp/noema-${name}"
            code=$(curl --silent --show-error --location \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              -H 'Pragma: no-cache' \
              -o "$out" -w '%{http_code}' "$url" || true)
            printf '%s' "$code"
          }

          ok=0
          for attempt in $(seq 1 60); do
            nonce="$(git rev-parse HEAD)-${attempt}"
            c_explore=$(fetch_asset explore "${base}/explore.html?delivery=${nonce}")
            c_entity=$(fetch_asset entity "${base}/entity.html?id=GOD-ODIN&delivery=${nonce}")
            c_index=$(fetch_asset index "${base}/search-index-v18.json?delivery=${nonce}")
            c_shell=$(fetch_asset shell "${base}/shell-v18.js?delivery=${nonce}")
            c_entityjs=$(fetch_asset entityjs "${base}/entity-v18.js?delivery=${nonce}")
            echo "Public attempt ${attempt}: explore=${c_explore} entity=${c_entity} index=${c_index} shell=${c_shell} entityjs=${c_entityjs}"

            if [ "$c_explore" = 200 ] && [ "$c_entity" = 200 ] && [ "$c_index" = 200 ] && [ "$c_shell" = 200 ] && [ "$c_entityjs" = 200 ] \
              && grep -q 'explore-v18.js' /tmp/noema-explore \
              && ! grep -q 'app-v1.js' /tmp/noema-explore \
              && grep -q 'entity-v18.js' /tmp/noema-entity \
              && ! grep -q 'app-v1.js' /tmp/noema-entity \
              && grep -q 'requestIdleCallback' /tmp/noema-entityjs \
              && ! grep -q 'drh-decomposition.json' /tmp/noema-entityjs \
              && grep -q 'NOEMA_COMPACT_SEARCH_V18' /tmp/noema-index \
              && grep -q 'Skip to main content' /tmp/noema-shell; then
              ok=1
              echo "NOEMA v1.8.1 Explore + Entity delivery contract is publicly visible (attempt ${attempt})."
              break
            fi
            sleep 3
          done
          test "$ok" = 1
