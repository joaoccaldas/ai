name: Studio Gallery Check

on:
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-gallery-check.yml'
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - '.github/workflows/studio-gallery-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        run: |
          node --check studio/rooms.js
          node --check studio/hall/hall.js

      - name: Validate the Exposition hall contract
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('studio')
          required = [
              root / 'index.html', root / 'rooms.js', root / 'ROOM_SYSTEM.md',
              root / 'hall' / 'hall.js', root / 'hall' / 'assets' / 'hall.glb',
              root / 'hall' / 'assets' / 'hall_lightmap.jpg', root / 'hall' / 'assets' / 'hall_env.hdr',
              root / 'hall' / 'blender' / 'hall.py', root / 'sokai' / 'index.html', root / 'sokai' / 'making' / 'index.html',
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))

          html = (root / 'index.html').read_text(encoding='utf-8')
          for ref in ('rooms.js', 'hall/hall.js', 'id="hall"', 'id="loader"', 'id="modal"'):
              if ref not in html:
                  raise SystemExit(f'index.html is missing {ref}')

          source = (root / 'rooms.js').read_text(encoding='utf-8')
          slugs = re.findall(r"slug:'([^']+)'", source)
          urls = re.findall(r"url:'([^']+)',\s*img:", source)
          imgs = re.findall(r"img:'([^']+)'", source)
          if not slugs or slugs[0] != 'sokai':
              raise SystemExit(f'SŌKAI must be the first work, found {slugs[:1]}')
          if len(slugs) != len(set(slugs)) or not (len(slugs) == len(urls) == len(imgs)):
              raise SystemExit('Every work needs a unique slug, a url and an img')
          if len(slugs) > 18:
              raise SystemExit(f'The hall has 18 niches (1 dais + 17); {len(slugs)} works need a re-bake with more niches')
          missing_pages = [u for u in urls if not (root / u / 'index.html').resolve().is_file()]
          missing_imgs = [i for i in imgs if not (root / i).is_file()]
          if missing_pages or missing_imgs:
              raise SystemExit(f'Missing pages {missing_pages} or artwork {missing_imgs}')
          print(f'Validated {len(slugs)} works; SŌKAI first; all pages and artwork present.')

      - name: Check file sizes
        run: |
          check() { size=$(wc -c < "$1"); if [ "$size" -gt "$2" ]; then echo "$1 is $size bytes (limit $2)"; exit 1; fi; }
          check studio/index.html 200000
          check studio/hall/hall.js 1500000
          check studio/hall/assets/hall.glb 8000000
          check studio/hall/assets/hall_lightmap.jpg 3000000
          check studio/sokai/index.html 20000000
