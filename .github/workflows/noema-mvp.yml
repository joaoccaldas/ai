name: NOEMA MVP

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'projects/noema/site/**'
      - 'projects/noema/e2e/**'
      - 'projects/noema/docs/ROADMAP.md'
      - '.github/workflows/noema-mvp.yml'
  push:
    branches: [main]
    paths:
      - 'projects/noema/site/**'
      - 'projects/noema/e2e/**'
      - 'projects/noema/docs/ROADMAP.md'
      - '.github/workflows/noema-mvp.yml'

permissions:
  contents: read

jobs:
  mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/noema/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps chromium
      - name: Front door, navigation, overflow, console
        run: npm test
        env:
          CI: 'true'
