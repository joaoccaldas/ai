name: NOEMA Religion Federation Publish

on:
  push:
    branches: [main, noema/v1.0-religion-decomposition]
    paths:
      - 'projects/noema/ontology/decomposition_v1.json'
      - 'projects/noema/ontology/altered_states_v1.json'
      - 'projects/noema/ontology/media_v1.json'
      - 'projects/noema/ontology/source_mappings.json'
      - 'projects/noema/ontology/drh_curated_mappings.json'
      - 'projects/noema/data/reference/belief-catalog-v1.json'
      - 'projects/noema/data/candidates/discovery-pressure-2026-08-29.json'
      - 'projects/noema/src/noema/patterns.py'
      - 'projects/noema/scripts/import_pulotu_decomposition.py'
      - 'projects/noema/scripts/import_drh_decomposition.py'
      - 'projects/noema/scripts/import_drh_catalog.py'
      - 'projects/noema/scripts/audit_dplace_religion_variables.py'
      - 'projects/noema/scripts/build_religion_federation_manifest.py'
      - 'projects/noema/scripts/build_pattern_candidates.py'
      - 'projects/noema/scripts/build_coverage_matrix.py'
      - 'projects/noema/scripts/build_research_health.py'
      - '.github/workflows/noema-decomposition-publish.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: write

concurrency:
  group: noema-religion-federation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-federation:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip noema-decomposition]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/noema
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NOEMA package
        run: pip install -e .
      - name: Build source projections and analysis products
        run: |
          python scripts/import_pulotu_decomposition.py --output site/religion-decomposition.json
          python scripts/import_drh_decomposition.py --output site/drh-decomposition.json
          python scripts/import_drh_catalog.py --max-routed-answers 0 --output site/drh-catalog.json
          python scripts/audit_dplace_religion_variables.py --output site/dplace-religion-variables.json
          python scripts/build_religion_federation_manifest.py --output site/religion-federation.json
          python scripts/build_pattern_candidates.py --output site/pattern-candidates.json
          python scripts/build_coverage_matrix.py --output site/coverage-matrix.json
          python scripts/build_research_health.py --output site/research-health.json
          for f in site/religion-decomposition.json site/drh-decomposition.json site/drh-catalog.json site/dplace-religion-variables.json site/religion-federation.json site/pattern-candidates.json site/coverage-matrix.json site/research-health.json; do python -m json.tool "$f" >/dev/null; done
      - name: Validate scale, statistics and epistemic semantics
        run: |
          python - <<'PY'
          import json
          p=json.load(open('site/religion-decomposition.json'));d=json.load(open('site/drh-decomposition.json'));c=json.load(open('site/drh-catalog.json'));v=json.load(open('site/dplace-religion-variables.json'));f=json.load(open('site/religion-federation.json'));pc=json.load(open('site/pattern-candidates.json'));cov=json.load(open('site/coverage-matrix.json'));h=json.load(open('site/research-health.json'))
          assert p['summary']['subjects']>=100 and p['summary']['accepted_assertions']>1000
          assert d['summary']['comparable_religious_groups']>500 and d['summary']['assertions']>10000
          assert c['summary']['entries']>1500 and c['summary']['questions']>4000 and c['summary']['routed_answers_exported']==0
          assert v['summary']['candidate_variables']>100
          assert f['summary']['comparable_belief_system_profiles']>700 and f['summary']['accepted_semantic_assertions']>10000
          assert f['gates']['unknown_is_absence'] is False and f['gates']['shared_feature_implies_common_origin'] is False and f['gates']['ritual_implies_psychoactive_use'] is False
          assert pc['status']=='HYPOTHESIS_GENERATION_ONLY' and [x['source'] for x in pc['cohorts']]==['PULOTU','DRH']
          assert all('explicitly PRESENT or explicitly ABSENT' in x['null_model']['missingness_rule'] for x in pc['cohorts'])
          assert all(0<=r['q_bh']<=1 and r['n_comparable']<=r['cohort_profiles'] for x in pc['cohorts'] for r in x['candidates'])
          assert all('phylogeny' in r['unresolved_confounders'] for x in pc['cohorts'] for r in x['candidates'])
          assert cov['dimensions'] and len(cov['sources'])==2
          assert h['metrics']['accepted_semantic_assertions']==f['summary']['accepted_semantic_assertions']
          print(json.dumps(f['summary'],indent=2));print(json.dumps(h['metrics'],indent=2))
          PY
      - name: Write observability manifest
        env:
          RUN_ID: ${{ github.run_id }}
          CODE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          f=json.load(open('site/religion-federation.json'));h=json.load(open('site/research-health.json'));now=datetime.now(timezone.utc).isoformat();s=f['summary']
          m={'run_id':f"religion-federation-{os.environ['RUN_ID']}",'task_type':'RELIGION_FEDERATION','status':'COMPLETED','started_at':now,'completed_at':now,'input_refs':['Pulotu','DRH/SCCSR','D-PLACE audit'],'sources_examined':3,'new_candidates':int(h['metrics'].get('dplace_religion_variable_candidates',0)),'candidate_updates':int(s.get('accepted_semantic_assertions',0)),'contradictions':0,'dating_revisions':0,'relationships_generated':int(h['metrics'].get('pattern_candidates_pulotu',0))+int(h['metrics'].get('pattern_candidates_drh',0)),'hypotheses_revisited':0,'hypotheses_promoted':0,'confidence_or_scope_changes':0,'review_items_created':0,'errors':[],'summary':f"Federation refreshed {s.get('comparable_belief_system_profiles',0)} comparable profiles and {s.get('accepted_semantic_assertions',0)} accepted assertions; pattern outputs remain descriptive candidates.",'code_commit':os.environ['CODE_SHA'],'epistemic_guards':{'model_output_is_evidence':False,'unknown_is_absent':False,'similarity_implies_descent':False,'automatic_claim_promotion':False}}
          p=Path(f"data/runs/religion-federation-{os.environ['RUN_ID']}.json");p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(m,indent=2)+'\n')
          PY
      - name: Commit refreshed federation and run manifest
        run: |
          set -euo pipefail
          files='site/religion-decomposition.json site/drh-decomposition.json site/drh-catalog.json site/dplace-religion-variables.json site/religion-federation.json site/pattern-candidates.json site/coverage-matrix.json site/research-health.json data/runs/religion-federation-${GITHUB_RUN_ID}.json'
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add $files
          git commit -m 'data(noema): refresh religion federation and run manifest [skip noema-decomposition]'
          for attempt in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push race on attempt ${attempt}; retrying"; sleep $((attempt*2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: noema-religion-federation
          path: |
            projects/noema/site/religion-decomposition.json
            projects/noema/site/drh-decomposition.json
            projects/noema/site/drh-catalog.json
            projects/noema/site/dplace-religion-variables.json
            projects/noema/site/religion-federation.json
            projects/noema/site/pattern-candidates.json
            projects/noema/site/coverage-matrix.json
            projects/noema/site/research-health.json
