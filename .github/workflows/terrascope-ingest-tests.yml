name: TerraScope NASA Ingest
on:
  pull_request:
    paths:
      - 'projects/terrascope/**'
      - '.github/workflows/terrascope-ingest-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify data contracts offline
        run: python3 -m unittest discover -s projects/terrascope -p 'test_*.py' -v
      - name: Compile verified importer
        run: python3 -m py_compile projects/terrascope/power_ingest.py
