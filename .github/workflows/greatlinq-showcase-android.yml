name: Greatlinq showcase Android preview

on:
  push:
    branches: [main]
    paths:
      - 'greatlinq-showcase/**'
      - '.github/workflows/greatlinq-showcase-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: greatlinq-showcase-android
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify visitor safety and web/Android parity
        working-directory: greatlinq-showcase
        run: |
          node verify.mjs
          node verify-android.mjs
      - name: Build debug-signed personal preview APK
        env:
          ONDA_SHOWCASE_VERSION_CODE: ${{ github.run_number }}
          ONDA_SHOWCASE_VERSION_NAME: 0.1.${{ github.run_number }}-preview
        run: gradle --no-daemon --stacktrace -p greatlinq-showcase/android :app:assembleDebug
      - name: Check APK signature, local assets and app ID
        run: |
          set -euo pipefail
          apk=greatlinq-showcase/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          unzip -l "$apk" | grep -F 'assets/index.html'
          unzip -l "$apk" | grep -F 'assets/model.js'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -6
          mkdir -p dist
          cp "$apk" dist/ond-ai-greatlinq-showcase.apk
          sha256sum dist/ond-ai-greatlinq-showcase.apk | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ond-ai-greatlinq-showcase-apk
          path: dist/
          if-no-files-found: error

  smoke:
    name: Install and open on Android emulator
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ond-ai-greatlinq-showcase-apk
          path: dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the APK launches without a fatal exception
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r dist/ond-ai-greatlinq-showcase.apk
            adb shell am start -W -n ai.ond.spatialshowcase/.MainActivity
            sleep 9
            adb shell pidof ai.ond.spatialshowcase
            adb exec-out screencap -p > dist/emulator-welcome.png
            adb logcat -d -s AndroidRuntime:E OndaShowcase:E > dist/android-logcat.txt || true
            ! grep -qE 'FATAL EXCEPTION|Main document failed' dist/android-logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ond-ai-greatlinq-android-smoke
          path: |
            dist/emulator-welcome.png
            dist/android-logcat.txt
          if-no-files-found: ignore

  publish:
    name: Publish APK to GitHub Releases
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ond-ai-greatlinq-showcase-apk
          path: dist
      - name: Create download release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: greatlinq-showcase-android-v0.1.${{ github.run_number }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'NOTES'
          ond.ai Spatial Showcase, Greatlinq concept edition.

          Personal Android preview. Built and installed on an Android emulator;
          not a Play Store release or a Greatlinq-approved integration.
          Includes the curated visitor HTML, CSS, JS, and explanatory artwork.
          Optional public media/GLB/Three.js requires internet access.

          To install: download the .apk onto an Android phone, open it in Files,
          and allow installation from that source when prompted.
          Future debug builds may require uninstalling the previous preview.
          NOTES
          gh release create "$TAG" \
            "dist/ond-ai-greatlinq-showcase.apk#ond-ai-greatlinq-showcase.apk" \
            "dist/SHA256SUMS.txt#SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ond.ai Greatlinq Showcase / Android preview #${GITHUB_RUN_NUMBER}" \
            --notes-file /tmp/release-notes.md \
            --prerelease