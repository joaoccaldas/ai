name: Build WYLD 3D assets
on:
  push:
    branches: [main]
    paths:
      - 'studio/wyld-store/tools/build_assets.py'
      - '.github/workflows/ridewyld-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic asset builder
        run: python -m pip install --disable-pip-version-check numpy==2.1.2 trimesh==4.8.3
      - name: Build semantic GLB assets
        run: python studio/wyld-store/tools/build_assets.py
      - name: Validate outputs
        run: |
          test -s studio/wyld-store/assets/athlete-stand.glb
          test -s studio/wyld-store/assets/athlete-aero.glb
          test -s studio/wyld-store/assets/athlete-run.glb
          test -s studio/wyld-store/assets/jersey-women.glb
          test -s studio/wyld-store/assets/jersey-men.glb
          test -s studio/wyld-store/assets/bib-tiffany.glb
          test -s studio/wyld-store/assets/cap.glb
      - name: Commit generated web assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studio/wyld-store/assets
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(wyld): refresh semantic 3d assets [skip ci]'
          git push
