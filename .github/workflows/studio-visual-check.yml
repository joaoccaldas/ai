name: Studio Visual Render

on:
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-visual-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.1 --silent
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/studio-server.log 2>&1 &
          sleep 2

      - name: Verify portfolio interactions and failure modes
        run: |
          mkdir -p output/playwright
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'] });
            try {
              const page = await browser.newPage();
              await page.goto('http://127.0.0.1:4173/studio/');
              const { default: verify } = await import('./studio/portfolio/browser-check.mjs');
              await verify(page);
            } finally { await browser.close(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS

      - name: Walk the hall and capture evidence
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'] });
            const errors = [];
            fs.mkdirSync('visual-evidence', { recursive: true });
            const yawFor = a => Math.atan2(-Math.cos(a * Math.PI / 180), Math.sin(a * Math.PI / 180));
            const tw = (a, u) => [Math.cos(a * Math.PI / 180) * u, Math.sin(a * Math.PI / 180) * u];
            async function walk(name, viewport) {
              const page = await browser.newPage({ viewport, deviceScaleFactor: 1, isMobile: name === 'mobile', hasTouch: name === 'mobile' });
              page.on('console', m => { if (m.type() === 'error' && !m.text().includes('Failed to load resource') && !m.text().includes('pointer lock')) errors.push(`${name}: ${m.text()}`); });
              page.on('pageerror', e => errors.push(`${name}: ${e.message}`));
              await page.goto('http://127.0.0.1:4173/studio/gallery.html', { waitUntil: 'networkidle', timeout: 240000 });
              await page.waitForFunction(() => document.querySelector('#loader')?.classList.contains('done'), null, { timeout: 240000 });
              const title = await page.evaluate(() => document.querySelector('#intro h1')?.textContent || '');
              if (!title.includes('walk into')) throw new Error(`${name}: hero did not render`);
              await page.waitForTimeout(3000);
              await page.screenshot({ path: `visual-evidence/${name}-00-entrance.png` });
              await page.click('#enterBtn');
              const layout = await page.evaluate(() => fetch('museum/assets/museum_layout.json').then(r => r.json()));
              const stops = [['atrium', 0, -6.8, 0], ...layout.wings.map(w => [w.key, ...tw(w.angle, 16.4), yawFor(w.angle)])];
              for (const [label, x, y, yaw] of stops) {
                await page.evaluate(([x, y, yaw]) => window.__MUSEUM.teleport(x, y, yaw, -.08), [x, y, yaw]);
                await page.waitForTimeout(6000);
                const lum = await page.evaluate(() => new Promise(res => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); c.width = 64; c.height = 40; const x = c.getContext('2d'); x.drawImage(img, 0, 0, 64, 40); const d = x.getImageData(0, 0, 64, 40).data; let s = 0; for (let i = 0; i < d.length; i += 4) s += d[i] + d[i + 1] + d[i + 2]; res(s / (d.length / 4) / 3); }; window.__MUSEUM.capture(); requestAnimationFrame(() => requestAnimationFrame(() => { img.src = window.__MUSEUM.capture(); })); }));
                console.log(`${name} ${label}: mean luminance ${lum.toFixed(1)}`);
                if (!(lum > 6)) errors.push(`${name} ${label}: museum rendered black (${lum})`);
                await page.screenshot({ path: `visual-evidence/${name}-${label}.png` });
              }
              await page.close();
            }
            await walk('desktop', { width: 1440, height: 900 });
            await walk('mobile', { width: 390, height: 844 });
            await browser.close();
            if (errors.length) throw new Error('Browser errors:\n' + errors.join('\n'));
          })();
          JS

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-visual-evidence
          path: |
            visual-evidence
            output/playwright
          if-no-files-found: error
