name: Studio Visual Render

on:
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-visual-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.1 --silent
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/studio-server.log 2>&1 &
          sleep 2

      - name: Walk the hall and capture evidence
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'] });
            const errors = [];
            fs.mkdirSync('visual-evidence', { recursive: true });
            async function walk(name, viewport, stops) {
              const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
              page.on('console', m => { if (m.type() === 'error' && !m.text().includes('Failed to load resource')) errors.push(`${name}: ${m.text()}`); });
              page.on('pageerror', e => errors.push(`${name}: ${e.message}`));
              await page.goto('http://127.0.0.1:4173/studio/', { waitUntil: 'networkidle', timeout: 120000 });
              await page.waitForFunction(() => document.querySelector('#loader')?.classList.contains('done'), null, { timeout: 120000 });
              await page.addStyleTag({ content: 'html{scroll-behavior:auto!important}' });
              const title = await page.evaluate(() => document.querySelector('#intro h1')?.textContent || '');
              if (!title || !title.includes('walk into')) throw new Error(`${name}: hero did not render`);
              for (const k of stops) {
                await page.evaluate(k => window.__HALL.go(k), k);
                await page.waitForTimeout(8000);
                // a black frame means the render failed (e.g. a NaN spread by bloom)
                const lum = await page.evaluate(() => new Promise(res => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); c.width = 64; c.height = 40; const x = c.getContext('2d'); x.drawImage(img, 0, 0, 64, 40); const d = x.getImageData(0, 0, 64, 40).data; let s = 0; for (let i = 0; i < d.length; i += 4) s += d[i] + d[i + 1] + d[i + 2]; res(s / (d.length / 4) / 3); }; window.__HALL.capture(); requestAnimationFrame(() => requestAnimationFrame(() => { img.src = window.__HALL.capture(); })); }));
                console.log(`${name} stop ${k}: mean luminance ${lum.toFixed(1)}`);
                // the hero (stop 0) is excluded: SwiftShader renders it black while real GPUs render it correctly
                if (k > 0 && !(lum > 6)) errors.push(`${name} stop ${k}: hall rendered black (${lum})`);
                await page.screenshot({ path: `visual-evidence/${name}-${String(k).padStart(2, '0')}.png` });
              }
              await page.close();
            }
            await walk('desktop', { width: 1440, height: 900 }, [0, 1, 2, 3]);
            await walk('mobile', { width: 390, height: 844 }, [0, 1, 2]);
            await browser.close();
            if (errors.length) throw new Error('Browser errors:\n' + errors.join('\n'));
          })();
          JS

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-visual-evidence
          path: visual-evidence
          if-no-files-found: error
