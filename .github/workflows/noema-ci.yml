name: NOEMA CI

on:
  push:
    paths:
      - 'projects/noema/**'
      - '.github/workflows/noema-ci.yml'
  pull_request:
    paths:
      - 'projects/noema/**'
      - '.github/workflows/noema-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/noema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Compile package and standalone scripts
        run: python -m compileall -q src scripts tests

      - name: Validate decomposition ontology and live Pulotu crosswalk
        run: |
          python -m json.tool ontology/decomposition_v1.json >/dev/null
          python -m json.tool ontology/source_mappings.json >/dev/null
          python -m json.tool ontology/drh_curated_mappings.json >/dev/null
          python -m json.tool data/candidates/discovery-pressure-2026-08-29.json >/dev/null
          python - <<'PY'
          import json
          q=json.load(open('data/candidates/discovery-pressure-2026-08-29.json'))
          assert q['status']=='CANDIDATE_UNREVIEWED' and len(q['candidates'])>=10
          assert all(c.get('review_target') for c in q['candidates'])
          assert 'No record in this file is evidence' in q['promotion_rule']
          PY
          python scripts/import_pulotu_decomposition.py --output /tmp/noema-religion-decomposition.json
          python -m json.tool /tmp/noema-religion-decomposition.json >/dev/null
          python - <<'PY'
          import json
          x=json.load(open('/tmp/noema-religion-decomposition.json'));s=x['summary']
          assert s['subjects']>=100 and s['upstream_variables']>=70 and s['assertions']>=1000
          assert s['mapped_assertions']>0 and s['raw_assertions']>0
          assert all(a['state']!='UNKNOWN' for a in x['assertions'])
          assert all(a.get('source_locator',{}).get('variable_id') for a in x['assertions'])
          print('PULOTU',json.dumps(s,indent=2))
          PY

      - name: Validate DRH/SCCSR compact decomposition corpus
        run: |
          python scripts/import_drh_decomposition.py --output /tmp/noema-drh-decomposition.json
          python -m json.tool /tmp/noema-drh-decomposition.json >/dev/null
          python - <<'PY'
          import json
          x=json.load(open('/tmp/noema-drh-decomposition.json'));s=x['summary']
          assert x['dataset_id']=='NOEMA-RELIGION-DECOMPOSITION-DRH-V1'
          assert s['subjects']>100 and s['questions']>100 and s['mapped_questions']>=20 and s['assertions']>100 and s['comparable_religious_groups']>0
          assert all(a['state'] in {'PRESENT','ABSENT','UNKNOWN'} for a in x['assertions'])
          assert all(a.get('source_locator',{}).get('question_id') for a in x['assertions'])
          assert all('expert_name' in a and 'branching_question' in a for a in x['assertions'])
          assert any(not q['mapped'] for q in x['questions']), 'raw DRH question index was lost'
          print('DRH',json.dumps(s,indent=2))
          PY

      - name: Validate reference catalog, media and Visual Core routes
        run: |
          python -m json.tool data/reference/belief-catalog-v1.json >/dev/null
          python -m json.tool data/reference/media-reviewed-v1.json >/dev/null
          python -m json.tool site/museum-reference-media.json >/dev/null
          python -m json.tool data/candidates/discovery-triage-2026-08-29.json >/dev/null
          python -m json.tool schemas/run-manifest-v1.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          catalog=json.load(open('data/reference/belief-catalog-v1.json'))
          ids=[e['id'] for e in catalog['entities']]
          assert len(ids)==len(set(ids)); known=set(ids)
          for e in catalog['entities']:
              assert e.get('name') and e.get('kind')
              assert e.get('profile_status') in {'REFERENCE_ONLY','ANALYTIC_COMPONENT','ANALYTIC_TEMPLATE'}
              for r in e.get('related_entities',[]): assert r in known,(e['id'],r)
              for s in e.get('sources',[]): assert str(s.get('url','')).startswith('https://')

          museum=json.load(open('site/museum-reference-media.json'))
          assert museum['policy']['not_evidence'] is True
          assert museum['record_count']>0
          for r in museum['records']:
              assert r['display_gate']=='REFERENCE_RENDER_ALLOWED_PROVIDER_ASSERTED_IDENTITY'
              assert r['evidence_status']=='NOT_EVIDENCE'
              assert r['rights'] in {'PUBLIC_DOMAIN','CC0'}
              assert r['provider_page_url'].startswith('https://') and r['image_url'].startswith('https://')

          commons=json.load(open('data/reference/media-reviewed-v1.json'))
          assert commons['policy']['reference_media_is_evidence'] is False
          assert commons['items']
          for r in commons['items']:
              assert r['identity_status']=='SOURCE_VERIFIED'
              assert r['rights_status']=='SOURCE_VERIFIED'
              assert r['evidence_status']=='REFERENCE_ONLY_NOT_EVIDENCE'

          app=Path('site/app-v1.js').read_text()
          assert 'reference_traits' in app and 'normalizeCatalog' in app

          home=Path('site/index.html').read_text()
          assert '<title>NOEMA · Religion, Ritual & Belief, Decomposed</title>' in home
          assert 'Understand what humans believe, and how beliefs connect.' in home and 'home-v2.js' in home

          # Route contract checks visible product semantics and each route's current
          # runtime. Explore + Entity are intentionally lightweight in v1.8.1.
          expectations={
              'site/explore.html':('What do you want to understand?','explore-v18.js'),
              'site/belief-systems.html':('No religion is one variable.','app-v1.js'),
              'site/gods.html':('Every god gets a workspace.','app-v1.js'),
              'site/rituals.html':('Compare actions before meanings.','app-v1.js'),
              'site/altered-states.html':('Substance is only one part of the experience.','app-v1.js'),
              'site/patterns.html':('What keeps appearing together?','app-v1.js'),
              'site/compare.html':('Same words do not mean same history.','app-v1.js'),
              'site/lineages.html':('Connection is not origin.','relationship-v2.js'),
              'site/sources-v1.html':('Every conclusion should have a trail.','app-v1.js'),
              'site/entity.html':('universal entity workspace','entity-v18.js'),
              'site/simulations.html':('Is a pattern surprising?',None),
              'site/drh.html':('Entries, questions, metadata.',None),
          }
          for path,(marker,script) in expectations.items():
              text=Path(path).read_text()
              assert marker in text,(path,marker)
              assert 'app-v1.css' in text,path
              if script: assert script in text,(path,script)

          explore=Path('site/explore.html').read_text()
          entity=Path('site/entity.html').read_text()
          entity_js=Path('site/entity-v18.js').read_text()
          assert 'app-v1.js' not in explore
          assert 'app-v1.js' not in entity and 'entity-depth-v14.js' not in entity
          assert 'drh-decomposition.json' not in entity_js and 'religion-decomposition.json' not in entity_js
          assert 'Reference sources ≠ claim-level evidence' in entity_js
          assert 'reference depiction, not evidence' in entity_js

          for p in Path('data/runs').glob('*.json'):
              r=json.load(open(p)); g=r['epistemic_guards']
              assert r['run_id'] and r['task_type'] and r['status']
              assert all(g[k] is False for k in ['model_output_is_evidence','unknown_is_absent','similarity_implies_descent','automatic_claim_promotion'])
          PY
          node --check site/app-v1.js
          node --check site/home-v2.js
          node --check site/cards-v2.js
          node --check site/explore-v18.js
          node --check site/entity-v18.js
          node --check site/shell-v18.js
          node --check site/relationship-v2.js
          node --check site/dashboard-v2.js
          node --check site/automation-pulse.js
          node --check site/pattern-v2.js

      - name: Validate every evidence dossier and deterministic analysis projection
        run: |
          python -m json.tool site/data.json >/dev/null
          for pack in data/reviewed/evidence-pack-*.json; do
            echo "validating ${pack}"
            python -m json.tool "$pack" >/dev/null
            out="/tmp/$(basename "${pack%.json}")-analysis.json"
            python scripts/analyze_evidence_pack.py "$pack" --output "$out"
            python -m json.tool "$out" >/dev/null
          done

      - name: Validate construct-matched Deep Time comparison
        run: |
          python -m json.tool data/comparisons/deep-time-constructs.json >/dev/null
          python scripts/compare_deep_time.py data/comparisons/deep-time-constructs.json data/reviewed/evidence-pack-002-deep-time.json data/reviewed/evidence-pack-003-homo-sapiens.json --output /tmp/noema-deep-time-comparison.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/noema-deep-time-comparison.json'))
          assert x['summary']['matched_constructs']==4
          forbidden=[v.lower() for v in x['forbidden_outputs']]
          assert 'species intelligence score' in forbidden and 'cognitive superiority ranking' in forbidden
          PY

      - name: Validate Human Meaning Atlas projection
        run: |
          python scripts/build_human_meaning_atlas.py site/societies.json data/reviewed/evidence-pack-001.json data/reviewed/evidence-pack-002-deep-time.json data/reviewed/evidence-pack-003-homo-sapiens.json --output /tmp/noema-human-meaning-atlas.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/noema-human-meaning-atlas.json'))
          assert x['atlas_id']=='NOEMA-HUMAN-MEANING-ATLAS-001' and x['release']=='v0.9'
          assert x['summary']['coverage_societies']==100 and x['summary']['mapped_dated_events']>0 and x['time_domain_bp']['max']==500000
          assert all(e['site'] is not None for e in x['mapped_events'])
          assert 'species ranking from evidence counts' in [v.lower() for v in x['forbidden_inferences']]
          PY

      - name: Validate federation, patterns, health and automation observability
        run: |
          python -m json.tool site/religion-federation.json >/dev/null
          python -m json.tool site/pattern-candidates.json >/dev/null
          python scripts/build_coverage_matrix.py --output site/coverage-matrix.json
          python scripts/build_research_health.py --output site/research-health.json
          python -m json.tool site/coverage-matrix.json >/dev/null
          python -m json.tool site/research-health.json >/dev/null
          python scripts/build_automation_pulse.py --output /tmp/automation-pulse.json
          python - <<'PY'
          import json
          f=json.load(open('site/religion-federation.json')); p=json.load(open('site/pattern-candidates.json')); cov=json.load(open('site/coverage-matrix.json')); h=json.load(open('site/research-health.json')); a=json.load(open('/tmp/automation-pulse.json'))
          assert f['summary']['comparable_belief_system_profiles']>700 and f['summary']['accepted_semantic_assertions']>10000
          assert p['status']=='HYPOTHESIS_GENERATION_ONLY'
          assert cov['dimensions'] and len(cov['sources'])==2
          assert all('explicitly PRESENT or explicitly ABSENT' in c['null_model']['missingness_rule'] for c in p['cohorts'])
          assert all(r['n_comparable']<=r['cohort_profiles'] and 'phylogeny' in r['unresolved_confounders'] for c in p['cohorts'] for r in c['candidates'])
          assert h['metrics']['ontology_dimensions']>=16
          assert a['status']=='OBSERVABILITY_ONLY'
          PY

      - name: Syntax-check inline research surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages={
              'site/deep-time.html':('<title>NOEMA Deep Time</title>','behavioral evidence may climb toward interpretation'),
              'site/deep-time-compare.html':('<title>NOEMA Deep Time Compare</title>','no species ranking'),
              'site/human-meaning-atlas.html':('<title>NOEMA Human Meaning Atlas</title>','500,000 BP → present'),
              'site/religion-decomposition.html':('<title>NOEMA Religion Decomposition</title>','Search religion beneath religion'),
              'site/simulations.html':('<title>Simulations · NOEMA</title>','Is a pattern surprising?'),
              'site/drh.html':('<title>DRH Explorer · NOEMA</title>','Entries, questions, metadata.'),
          }
          for path,required in pages.items():
              html=Path(path).read_text(); scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I); inline=[s for s in scripts if s.strip()]; assert inline,path
              target=Path('/tmp')/(Path(path).stem+'-noema-site.js'); target.write_text('\n'.join(inline))
              for marker in required: assert marker in html,(path,marker)
              print(target)
          PY
          node --check /tmp/deep-time-noema-site.js
          node --check /tmp/deep-time-compare-noema-site.js
          node --check /tmp/human-meaning-atlas-noema-site.js
          node --check /tmp/religion-decomposition-noema-site.js
          node --check /tmp/simulations-noema-site.js
          node --check /tmp/drh-noema-site.js

      - run: pytest
