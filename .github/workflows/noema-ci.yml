name: NOEMA CI

on:
  push:
    paths:
      - 'projects/noema/**'
      - '.github/workflows/noema-ci.yml'
  pull_request:
    paths:
      - 'projects/noema/**'
      - '.github/workflows/noema-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/noema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Compile package and standalone scripts
        run: python -m compileall -q src scripts tests
      - name: Validate decomposition ontology and live Pulotu crosswalk
        run: |
          python -m json.tool ontology/decomposition_v1.json >/dev/null
          python -m json.tool ontology/source_mappings.json >/dev/null
          python -m json.tool data/candidates/discovery-pressure-2026-08-29.json >/dev/null
          python - <<'PY'
          import json
          q=json.load(open('data/candidates/discovery-pressure-2026-08-29.json'))
          assert q['status'] == 'CANDIDATE_UNREVIEWED'
          assert len(q['candidates']) >= 10
          assert all(c.get('review_target') for c in q['candidates'])
          assert 'No record in this file is evidence' in q['promotion_rule']
          PY
          python scripts/import_pulotu_decomposition.py --output /tmp/noema-religion-decomposition.json
          python -m json.tool /tmp/noema-religion-decomposition.json >/dev/null
          python - <<'PY'
          import json
          x=json.load(open('/tmp/noema-religion-decomposition.json'))
          s=x['summary']
          assert s['subjects'] >= 100, s
          assert s['upstream_variables'] >= 70, s
          assert s['assertions'] >= 1000, s
          assert s['mapped_assertions'] > 0, s
          assert s['raw_assertions'] > 0, s
          assert all(a['state'] != 'UNKNOWN' for a in x['assertions'])
          assert all(a.get('source_locator',{}).get('variable_id') for a in x['assertions'])
          print(json.dumps(s, indent=2))
          PY
      - name: Validate v1 reference catalog and multi-page routes
        run: |
          python -m json.tool data/reference/belief-catalog-v1.json >/dev/null
          python -m json.tool data/candidates/discovery-triage-2026-08-29.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.load(open('data/reference/belief-catalog-v1.json'))
          ids=[e['id'] for e in c['entities']]
          assert len(ids) == len(set(ids)), 'duplicate reference entity IDs'
          known=set(ids)
          for e in c['entities']:
              assert e.get('name') and e.get('kind')
              assert e.get('profile_status') in {'REFERENCE_ONLY','ANALYTIC_COMPONENT','ANALYTIC_TEMPLATE'}
              assert e.get('profile_status') != 'EVIDENCE'
              for r in e.get('related_entities',[]):
                  assert r in known, f'unknown related entity {r} from {e["id"]}'
              for s in e.get('sources',[]):
                  assert str(s.get('url','')).startswith('https://')
          pages={
              'site/dashboard-v1.html':'Search beneath religion.',
              'site/explore.html':'Break belief systems into parts.',
              'site/belief-systems.html':'No religion is one variable.',
              'site/gods.html':'Every god gets a card.',
              'site/rituals.html':'Compare actions before meanings.',
              'site/altered-states.html':'Substance is only one part of the experience.',
              'site/patterns.html':'What keeps appearing together?',
              'site/compare.html':'Same words do not mean same history.',
              'site/lineages.html':'Connection is not origin.',
              'site/sources-v1.html':'Every conclusion should have a trail.',
              'site/entity.html':'universal entity card',
          }
          for path,marker in pages.items():
              text=Path(path).read_text(encoding='utf-8')
              assert marker in text, (path,marker)
              assert 'app-v1.css' in text
              assert 'app-v1.js' in text
          PY
          node --check site/app-v1.js
      - name: Validate every evidence dossier and deterministic analysis projection
        run: |
          python -m json.tool site/data.json >/dev/null
          for pack in data/reviewed/evidence-pack-*.json; do
            echo "validating ${pack}"
            python -m json.tool "$pack" >/dev/null
            out="/tmp/$(basename "${pack%.json}")-analysis.json"
            python scripts/analyze_evidence_pack.py "$pack" --output "$out"
            python -m json.tool "$out" >/dev/null
          done
      - name: Validate construct-matched Deep Time comparison
        run: |
          python -m json.tool data/comparisons/deep-time-constructs.json >/dev/null
          python scripts/compare_deep_time.py \
            data/comparisons/deep-time-constructs.json \
            data/reviewed/evidence-pack-002-deep-time.json \
            data/reviewed/evidence-pack-003-homo-sapiens.json \
            --output /tmp/noema-deep-time-comparison.json
          python -m json.tool /tmp/noema-deep-time-comparison.json >/dev/null
          python - <<'PY'
          import json
          x=json.load(open('/tmp/noema-deep-time-comparison.json'))
          assert x['summary']['matched_constructs'] == 4
          assert 'species intelligence score' in [v.lower() for v in x['forbidden_outputs']]
          assert 'cognitive superiority ranking' in [v.lower() for v in x['forbidden_outputs']]
          PY
      - name: Validate Human Meaning Atlas projection
        run: |
          python scripts/build_human_meaning_atlas.py \
            site/societies.json \
            data/reviewed/evidence-pack-001.json \
            data/reviewed/evidence-pack-002-deep-time.json \
            data/reviewed/evidence-pack-003-homo-sapiens.json \
            --output /tmp/noema-human-meaning-atlas.json
          python -m json.tool /tmp/noema-human-meaning-atlas.json >/dev/null
          python - <<'PY'
          import json
          x=json.load(open('/tmp/noema-human-meaning-atlas.json'))
          assert x['atlas_id'] == 'NOEMA-HUMAN-MEANING-ATLAS-001'
          assert x['release'] == 'v0.9'
          assert x['summary']['coverage_societies'] == 100
          assert x['summary']['mapped_dated_events'] > 0
          assert x['time_domain_bp']['max'] == 500000
          assert all(e['site'] is not None for e in x['mapped_events'])
          assert 'species ranking from evidence counts' in [v.lower() for v in x['forbidden_inferences']]
          PY
      - name: Syntax-check observatory JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages = {
              'site/index.html': ('<title>NOEMA Observatory</title>', 'Search beneath religion.'),
              'site/deep-time.html': ('<title>NOEMA Deep Time</title>', 'behavioral evidence may climb toward interpretation'),
              'site/deep-time-compare.html': ('<title>NOEMA Deep Time Compare</title>', 'no species ranking'),
              'site/human-meaning-atlas.html': ('<title>NOEMA Human Meaning Atlas</title>', '500,000 BP → present'),
              'site/religion-decomposition.html': ('<title>NOEMA Religion Decomposition</title>', 'Search religion beneath religion'),
          }
          for path, required in pages.items():
              html=Path(path).read_text(encoding='utf-8')
              scripts=re.findall(r'<script>(.*?)</script>', html, flags=re.S|re.I)
              assert scripts, f'inline site script not found in {path}'
              target=Path('/tmp')/(Path(path).stem + '-noema-site.js')
              target.write_text('\n'.join(scripts), encoding='utf-8')
              for marker in required:
                  assert marker in html, f'{marker!r} missing from {path}'
              print(target)
          PY
          node --check /tmp/index-noema-site.js
          node --check /tmp/deep-time-noema-site.js
          node --check /tmp/deep-time-compare-noema-site.js
          node --check /tmp/human-meaning-atlas-noema-site.js
          node --check /tmp/religion-decomposition-noema-site.js
      - run: pytest
