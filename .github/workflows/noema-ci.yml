name: NOEMA CI

on:
  push:
    paths:
      - 'projects/noema/**'
      - '.github/workflows/noema-ci.yml'
  pull_request:
    paths:
      - 'projects/noema/**'
      - '.github/workflows/noema-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/noema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest
