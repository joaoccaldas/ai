name: Studio Effects Commercial V2 Check

on:
  push:
    branches: [main, feat/studio-effects-commercial-v2]
    paths:
      - 'studio/effects/**'
      - '.github/workflows/studio-effects-check.yml'
  pull_request:
    paths:
      - 'studio/effects/**'
      - '.github/workflows/studio-effects-check.yml'

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.54.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start server
        run: |
          python3 -m http.server 4173 >/tmp/studio-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/studio/effects/ >/dev/null && break; sleep 1; done
      - name: Exercise commercial effects
        run: |
          mkdir -p evidence
          cat > /tmp/check.cjs <<'NODE'
          const { chromium }=require('playwright');
          const demos=['cursor-light','cutaway-reveal','day-night-morph','ambient-spill','world-transition','camera-depth','architectural-type','theatre-light','bioluminescence','interactive-hud'];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            for(const demo of demos){
              await page.goto(`http://127.0.0.1:4173/studio/effects/${demo}/`,{waitUntil:'networkidle'});
              await page.waitForSelector('.experience',{timeout:15000});
              await page.waitForFunction(()=>Array.isArray(window.__COMMERCIAL_FRAMES)&&window.__COMMERCIAL_FRAMES.length===10,{timeout:15000});
              const assetError=await page.evaluate(()=>document.body.dataset.assetError||'');
              if(assetError) throw new Error(`${demo}: generated assets failed`);
              await page.mouse.move(1040,360,{steps:12});
              if(['cutaway-reveal','day-night-morph','world-transition','theatre-light'].includes(demo)) await page.mouse.click(1080,380);
              await page.waitForTimeout(demo==='world-transition'?1250:900);
              await page.screenshot({path:`evidence/${demo}.png`,fullPage:true});
              const bg=await page.locator('.scene').first().evaluate(el=>getComputedStyle(el).backgroundImage);
              if(!bg.includes('blob:')) throw new Error(`${demo}: generated frame not mounted`);
            }
            if(errors.length) throw new Error(`Browser errors: ${errors.join(' | ')}`);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-effects-commercial-evidence
          path: evidence
          retention-days: 30
