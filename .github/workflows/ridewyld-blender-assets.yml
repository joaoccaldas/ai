name: Build WYLD Blender assets
on:
  push:
    branches: [main]
    paths:
      - 'studio/wyld-store/blender/build_assets.py'
      - '.github/workflows/ridewyld-blender-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Build WYLD Blender GLBs
        run: blender -b --python-expr "import sys; sys.path.append('/usr/lib/python3/dist-packages'); exec(compile(open('studio/wyld-store/blender/build_assets.py').read(), 'build_assets.py', 'exec'))"
      - name: Validate Blender outputs
        run: |
          echo "Generated Blender assets:"
          find studio/wyld-store/assets/blender -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          glb_count=$(find studio/wyld-store/assets/blender -maxdepth 1 -type f -name '*.glb' | wc -l)
          test "$glb_count" -ge 9
          test -s studio/wyld-store/assets/blender/manifest.json
      - name: Commit Blender assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f studio/wyld-store/assets/blender
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(wyld): refresh Blender-authored 3d assets [skip ci]'
          git push
