name: MashLab Check

on:
  push:
    paths:
      - 'mashlab/**'
      - '.github/workflows/mashlab-check.yml'
  pull_request:
    paths:
      - 'mashlab/**'
      - '.github/workflows/mashlab-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and DSP tests
        working-directory: mashlab
        run: |
          node --check app.js
          node --check dsp.js
          node --check sw.js
          node tests/dsp.test.mjs
      - name: Static smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mashlab-server.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/mashlab/ >/tmp/mashlab.html && break
            sleep 0.5
          done
          grep -q 'INTELLIGENT MASHUP STUDIO' /tmp/mashlab.html
          curl --fail --silent http://127.0.0.1:4173/mashlab/app.js | grep -q 'generateIdeas'
          curl --fail --silent http://127.0.0.1:4173/mashlab/manifest.webmanifest | python3 -m json.tool >/dev/null
