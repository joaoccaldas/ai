name: WYLD Android App

# Builds the WYLD Android app (Capacitor shell around studio/wyld-store/app),
# boots it on an emulator as a smoke test, then publishes the APK to the
# website at studio/wyld-store/downloads/WYLD.apk.
#
# Optional repository secrets for a stable release signature (recommended, so
# updates install over previous versions):
#   WYLD_KEYSTORE_BASE64, WYLD_KEYSTORE_PASSWORD, WYLD_KEY_ALIAS, WYLD_KEY_PASSWORD
# Without them the APK is signed with a debug key.

on:
  push:
    branches: [main]
    paths:
      - 'studio/wyld-store/app/**'
      - 'studio/wyld-store/src/catalog.js'
      - 'studio/wyld-store/native/**'
      - '.github/workflows/wyld-android.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: wyld-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio/wyld-store/native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.WYLD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wyld.keystore"
            echo "WYLD_KEYSTORE_FILE=$RUNNER_TEMP/wyld.keystore" >> "$GITHUB_ENV"
            echo "Release key configured."
          else
            echo "::notice::No release key secrets set; signing with a debug key."
          fi

      - name: Build APK
        env:
          WYLD_KEYSTORE_PASSWORD: ${{ secrets.WYLD_KEYSTORE_PASSWORD }}
          WYLD_KEY_ALIAS: ${{ secrets.WYLD_KEY_ALIAS }}
          WYLD_KEY_PASSWORD: ${{ secrets.WYLD_KEY_PASSWORD }}
        run: |
          export WYLD_VERSION_CODE=$(( ${{ github.run_number }} + 10 ))
          export WYLD_VERSION_NAME="1.${{ github.run_number }}"
          npm run sync
          cd android && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/WYLD.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$GITHUB_WORKSPACE/WYLD.apk"
          ls -la "$GITHUB_WORKSPACE/WYLD.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WYLD-apk
          path: WYLD.apk
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WYLD-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r WYLD.apk
            adb shell am start -W -n com.ridewyld.app/.MainActivity
            sleep 20
            adb shell pidof com.ridewyld.app
            adb exec-out screencap -p > launch.png
            adb logcat -d | grep -iE "AndroidRuntime|FATAL|Capacitor|chromium" | tail -60 > logcat.txt || true
            ! grep -q "FATAL EXCEPTION" logcat.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WYLD-smoke-test
          path: |
            launch.png
            logcat.txt

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: WYLD-apk
          path: studio/wyld-store/downloads

      - name: Commit APK to the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f studio/wyld-store/downloads/WYLD.apk
          if git diff --cached --quiet; then echo "APK unchanged"; exit 0; fi
          git commit -m "build(wyld): publish Android app [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null || echo "::notice::Pages rebuild request failed; it will publish on the next push."
