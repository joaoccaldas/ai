name: Gaudi Rev17 Aligned Comparison Build

on:
  push:
    branches: [gaudi-nexus-rev16-build-tmp]
    paths:
      - '.github/workflows/gaudi-rev16-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender 5.2
        run: |
          curl -fsSL 'https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz' -o blender.tar.xz
          tar -xf blender.tar.xz
          echo "$PWD/blender-5.2.0-linux-x64" >> "$GITHUB_PATH"

      - name: Install headless render runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1

      - name: Download exact Rev15 and municipal crop
        run: |
          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_31Vx2ThP2hxeA9WUkkpCfbJLaeb/57590020-3bff-4a29-89c7-9bdf05a130c6.blend' -o rev15.blend
          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_31Vx2ThP2hxeA9WUkkpCfbJLaeb/eaef5ac9-3706-45dc-809e-73c0b8b4c864.glb' -o municipal.glb
          echo 'cc1179cd2c2b379f954cbc55eb995f88d0786e08b37abfaca7e71417c4b1d494  rev15.blend' | sha256sum -c -
          echo 'f5c324141f1328666c528810b8212c3152f2b6970bd780c6bb4516ee8c3e3f1c  municipal.glb' | sha256sum -c -

      - name: Build Rev17 aligned comparison scene
        run: |
          cat > build_rev17.py <<'PY'
          import bpy, json, hashlib
          from mathutils import Vector

          def sha256(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for c in iter(lambda:f.read(1024*1024), b''):
                      h.update(c)
              return h.hexdigest()

          before=set(o.name for o in bpy.data.objects)
          bpy.ops.import_scene.gltf(filepath='municipal.glb')
          imported=[o for o in bpy.data.objects if o.name not in before]

          coll=bpy.data.collections.get('00_SITE_MUNICIPAL_IMPORTED')
          if not coll:
              coll=bpy.data.collections.new('00_SITE_MUNICIPAL_IMPORTED')
              bpy.context.scene.collection.children.link(coll)

          for o in imported:
              for c in list(o.users_collection):
                  c.objects.unlink(o)
              coll.objects.link(o)

          coll['source']='Ajuntament de Barcelona Barri 06 3D model'
          coll['source_crs']='EPSG:25831'
          coll['source_units']='metres'
          coll['source_archive_sha256']='186ed46321b9ec3baf7f6dc14235a32a8dd7a3fa54d32e815cddc4d0a91d9ef9'
          coll['source_glb_sha256']='f5c324141f1328666c528810b8212c3152f2b6970bd780c6bb4516ee8c3e3f1c'
          coll['local_origin_e']=430901.597832363
          coll['local_origin_n']=4583892.983829999
          coll['local_origin_z']=33.0
          coll['status']='IMPORTED_ALIGNED_TO_PLAZA_CENTROID_COMPARISON_ONLY'
          # glTF import maps source Z-up into Blender as X=X, Y=-Z, Z=Y.
          # Restore municipal EPSG:25831 axes, then translate the municipal
          # OSM plaza centroid onto the Rev15 Plaza polygon centroid.
          import math
          import_state=[]
          for o in imported:
              import_state.append({
                  'name':o.name,
                  'rotation_euler_deg':[round(math.degrees(float(v)),6) for v in o.rotation_euler],
                  'location':[round(float(v),6) for v in o.location],
                  'local_bbox_min':[round(float(min(v.co[i] for v in o.data.vertices)),6) for i in range(3)] if o.type=='MESH' else None,
                  'local_bbox_max':[round(float(max(v.co[i] for v in o.data.vertices)),6) for i in range(3)] if o.type=='MESH' else None
              })
              if o.type=='MESH':
                  for v in o.data.vertices:
                      x,y,z=v.co
                      v.co=(x,z,-y)
                  o.data.update()
              o.rotation_euler=(0.0,0.0,0.0)
              o.location.x += 13.359293125672881
              o.location.y += 108.63406337943947
          coll['alignment_method']='mesh_coordinate_remap'
          coll['alignment_coordinate_map']='imported (x,y,z) -> source axes (x,z,-y)'
          coll['alignment_object_rotation_deg']=[0.0,0.0,0.0]
          coll['alignment_translation_x_m']=13.359293125672881
          coll['alignment_translation_y_m']=108.63406337943947
          coll['alignment_anchor']='municipal OSM plaza centroid -> Rev15 Plaza polygon area centroid'
          bpy.context.view_layer.update()

          pts=[]
          for o in imported:
              if o.type=='MESH':
                  for c in o.bound_box:
                      pts.append(o.matrix_world @ Vector(c))
          municipal_bbox=None
          if pts:
              mn=[min(p[i] for p in pts) for i in range(3)]
              mx=[max(p[i] for p in pts) for i in range(3)]
              municipal_bbox={
                  'min':[round(float(x),3) for x in mn],
                  'max':[round(float(x),3) for x in mx],
                  'center':[round(float((mn[i]+mx[i])/2),3) for i in range(3)],
                  'size':[round(float(mx[i]-mn[i]),3) for i in range(3)]
              }

          sagrada=[o for o in bpy.data.objects if o.name.startswith('Sagrada_')]
          pts2=[]
          for o in sagrada:
              if o.type=='MESH':
                  for c in o.bound_box:
                      pts2.append(o.matrix_world @ Vector(c))
          proxy_bbox=None
          if pts2:
              mn=[min(p[i] for p in pts2) for i in range(3)]
              mx=[max(p[i] for p in pts2) for i in range(3)]
              proxy_bbox={
                  'min':[round(float(x),3) for x in mn],
                  'max':[round(float(x),3) for x in mx],
                  'center':[round(float((mn[i]+mx[i])/2),3) for i in range(3)],
                  'size':[round(float(mx[i]-mn[i]),3) for i in range(3)]
              }

          bpy.context.scene['gaudi_revision_candidate']=17
          bpy.context.scene['municipal_import_status']='ALIGNED_BY_PLAZA_CENTROID_COMPARISON_ONLY'
          bpy.context.scene['rev15_sha256']='cc1179cd2c2b379f954cbc55eb995f88d0786e08b37abfaca7e71417c4b1d494'
          bpy.context.scene['municipal_glb_sha256']='f5c324141f1328666c528810b8212c3152f2b6970bd780c6bb4516ee8c3e3f1c'

          # Diagnostic evidence renders before save.
          scene=bpy.context.scene
          scene.render.engine='BLENDER_WORKBENCH'
          scene.display.shading.light='STUDIO'
          scene.display.shading.show_shadows=True
          scene.display.shading.show_cavity=True
          scene.render.image_settings.file_format='PNG'

          proxy_coll=bpy.data.collections.get('CONTEXT')
          municipal_coll=coll

          def set_hidden(collection, hidden):
              if collection:
                  collection.hide_render=hidden

          # Top-down municipal context with old proxy context hidden.
          diag=bpy.data.cameras.get('DIAG_TOP') or bpy.data.cameras.new('DIAG_TOP')
          diag_obj=bpy.data.objects.get('DIAG_TOP') or bpy.data.objects.new('DIAG_TOP',diag)
          if not diag_obj.users_collection:
              scene.collection.objects.link(diag_obj)
          diag.type='ORTHO'; diag.ortho_scale=650
          diag_obj.location=(30,110,500)
          diag_obj.rotation_euler=(0,0,0)
          scene.camera=diag_obj
          scene.render.resolution_x=900; scene.render.resolution_y=900; scene.render.resolution_percentage=100

          set_hidden(proxy_coll,True); set_hidden(municipal_coll,False)
          scene.render.filepath='//top_municipal.png'
          bpy.ops.render.render(write_still=True)

          set_hidden(proxy_coll,False); set_hidden(municipal_coll,True)
          scene.render.filepath='//top_proxy.png'
          bpy.ops.render.render(write_still=True)

          # Existing hero camera with authoritative municipal vs proxy context.
          hero=bpy.data.objects.get('HeroCam')
          scene.camera=hero
          scene.render.resolution_x=480; scene.render.resolution_y=270

          set_hidden(proxy_coll,True); set_hidden(municipal_coll,False)
          scene.render.filepath='//hero_municipal.png'
          bpy.ops.render.render(write_still=True)

          set_hidden(proxy_coll,False); set_hidden(municipal_coll,True)
          scene.render.filepath='//hero_proxy.png'
          bpy.ops.render.render(write_still=True)


          # Human-eye camera search against authoritative municipal context.
          from mathutils import Vector
          def point_camera(cam_obj, target):
              direction=Vector(target)-cam_obj.location
              cam_obj.rotation_euler=direction.to_track_quat('-Z','Y').to_euler()

          target=(101.7,97.4,32.0)
          candidates=[
              ('VIEWBAY_A',(-5.351,54.417,1.56)),
              ('VIEWBAY_B',(-12.0,50.0,1.56)),
              ('COMMUNITY_C',(-20.0,47.0,1.56)),
              ('THRESHOLD_D',(-30.0,38.0,1.56)),
              ('MARKET_EDGE_E',(-40.0,28.0,1.56)),
          ]
          camera_rows=[]
          set_hidden(proxy_coll,True); set_hidden(municipal_coll,False)
          scene.render.resolution_x=720; scene.render.resolution_y=405
          for cid,pos in candidates:
              data=bpy.data.cameras.get('SEARCH_'+cid) or bpy.data.cameras.new('SEARCH_'+cid)
              cam=bpy.data.objects.get('SEARCH_'+cid) or bpy.data.objects.new('SEARCH_'+cid,data)
              if not cam.users_collection:
                  scene.collection.objects.link(cam)
              data.lens=32
              cam.location=pos
              point_camera(cam,target)
              scene.camera=cam
              scene.render.filepath='//camera_'+cid.lower()+'.png'
              bpy.ops.render.render(write_still=True)
              camera_rows.append({
                  'id':cid,
                  'position':[round(float(x),3) for x in cam.location],
                  'rotation_euler':[round(float(x),6) for x in cam.rotation_euler],
                  'lens_mm':32,
                  'target':list(target)
              })
          with open('camera_search.json','w') as f:
              json.dump({'target':list(target),'candidates':camera_rows},f,indent=2)


          # Open-plaza human-eye candidates found by ray-cast visibility search.
          open_candidates=[
              ('PLAZA_0_50',(0.0,50.0,1.56),(96.1,100.4,22.0)),
              ('PLAZA_10_50',(10.0,50.0,1.56),(96.1,100.4,22.0)),
              ('PLAZA_0_40',(0.0,40.0,1.56),(96.1,100.4,30.0)),
              ('PLAZA_N10_40',(-10.0,40.0,1.56),(96.1,100.4,22.0)),
              ('PLAZA_N30_50',(-30.0,50.0,1.56),(96.1,100.4,45.0)),
          ]
          open_rows=[]
          set_hidden(proxy_coll,True); set_hidden(municipal_coll,False)
          scene.render.resolution_x=720; scene.render.resolution_y=405
          for cid,pos,tgt in open_candidates:
              data=bpy.data.cameras.get('SEARCH_'+cid) or bpy.data.cameras.new('SEARCH_'+cid)
              cam=bpy.data.objects.get('SEARCH_'+cid) or bpy.data.objects.new('SEARCH_'+cid,data)
              if not cam.users_collection:
                  scene.collection.objects.link(cam)
              data.lens=32
              cam.location=pos
              point_camera(cam,tgt)
              scene.camera=cam
              scene.render.filepath='//camera_'+cid.lower()+'.png'
              bpy.ops.render.render(write_still=True)
              open_rows.append({
                  'id':cid,'position':list(pos),
                  'rotation_euler':[round(float(x),6) for x in cam.rotation_euler],
                  'lens_mm':32,'target':list(tgt)
              })
          with open('camera_open_plaza_search.json','w') as f:
              json.dump({'candidates':open_rows},f,indent=2)


          # Tight final-hero geometry refinement around the strongest open-plaza zone.
          refined=[
              ('HERO_F1',(-8.0,38.0,1.56),(96.1,100.4,28.0),32),
              ('HERO_F2',(-12.0,40.0,1.56),(96.1,100.4,28.0),32),
              ('HERO_F3',(-15.0,42.0,1.56),(96.1,100.4,30.0),32),
              ('HERO_F4',(-18.0,44.0,1.56),(96.1,100.4,32.0),32),
              ('HERO_F5',(-12.0,40.0,1.56),(96.1,100.4,28.0),35),
          ]
          refined_rows=[]
          set_hidden(proxy_coll,True); set_hidden(municipal_coll,False)
          scene.render.resolution_x=720; scene.render.resolution_y=405
          for cid,pos,tgt,lens in refined:
              data=bpy.data.cameras.get(cid) or bpy.data.cameras.new(cid)
              cam=bpy.data.objects.get(cid) or bpy.data.objects.new(cid,data)
              if not cam.users_collection:
                  scene.collection.objects.link(cam)
              data.lens=lens
              cam.location=pos
              point_camera(cam,tgt)
              scene.camera=cam
              scene.render.filepath='//camera_'+cid.lower()+'.png'
              bpy.ops.render.render(write_still=True)
              refined_rows.append({
                  'id':cid,'position':list(pos),
                  'rotation_euler':[round(float(x),6) for x in cam.rotation_euler],
                  'lens_mm':lens,'target':list(tgt)
              })
          with open('camera_refined_hero_search.json','w') as f:
              json.dump({'candidates':refined_rows},f,indent=2)


          # Eevee proof of the selected F3 geometry candidate.
          scene.render.engine='BLENDER_EEVEE'
          scene.render.resolution_x=960; scene.render.resolution_y=540
          scene.render.resolution_percentage=100
          scene.render.image_settings.file_format='PNG'
          set_hidden(proxy_coll,True); set_hidden(municipal_coll,False)
          f3=bpy.data.objects.get('HERO_F3')
          scene.camera=f3
          scene.render.filepath='//hero_f3_eevee.png'
          bpy.ops.render.render(write_still=True)

          # Return to non-destructive comparison state: both available.
          set_hidden(proxy_coll,False); set_hidden(municipal_coll,False)
          scene.camera=hero

          bpy.ops.wm.save_as_mainfile(filepath='rev17_aligned.blend')

          report={
              'status':'REV17_ALIGNED_COMPARISON_BUILT_NOT_PROMOTED',
              'imported_objects':len(imported),
              'total_objects':len(bpy.data.objects),
              'municipal_bbox':municipal_bbox,
              'import_state_before_axis_restore':import_state,
              'proxy_sagrada_bbox':proxy_bbox,
              'rev15_sha256':'cc1179cd2c2b379f954cbc55eb995f88d0786e08b37abfaca7e71417c4b1d494',
              'municipal_glb_sha256':'f5c324141f1328666c528810b8212c3152f2b6970bd780c6bb4516ee8c3e3f1c',
              'note':'Municipal collection axis-restored and translated by plaza-centroid anchor. Proxy remains untouched for side-by-side reconciliation.'
          }
          with open('rev17_report.json','w') as f:
              json.dump(report,f,indent=2)
          print(json.dumps(report,indent=2))
          PY

          blender --background rev15.blend --python build_rev17.py
          sha256sum rev17_aligned.blend rev17_report.json > rev17_sha256.txt
          ls -lh rev17_aligned.blend rev17_report.json rev17_sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gaudi-rev16-comparison
          path: |
            rev17_aligned.blend
            rev17_report.json
            rev17_sha256.txt
            top_municipal.png
            top_proxy.png
            hero_municipal.png
            hero_proxy.png
            camera_viewbay_a.png
            camera_viewbay_b.png
            camera_community_c.png
            camera_threshold_d.png
            camera_market_edge_e.png
            camera_search.json
            camera_plaza_0_50.png
            camera_plaza_10_50.png
            camera_plaza_0_40.png
            camera_plaza_n10_40.png
            camera_plaza_n30_50.png
            camera_open_plaza_search.json
            camera_hero_f1.png
            camera_hero_f2.png
            camera_hero_f3.png
            camera_hero_f4.png
            camera_hero_f5.png
            camera_refined_hero_search.json
            hero_f3_eevee.png
          retention-days: 30
