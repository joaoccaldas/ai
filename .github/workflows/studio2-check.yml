name: Studio 2 Check

on:
  pull_request:
    paths:
      - 'studio2/**'
      - '.github/workflows/studio2-check.yml'
  push:
    branches: [main]
    paths:
      - 'studio2/**'
      - '.github/workflows/studio2-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Studio 2 contracts
        run: |
          cd studio2
          npm run check
          node --check app.js
          node --check world.js
      - name: Guard against accidental Studio 1 coupling
        run: |
          test -f studio2/index.html
          ! grep -R "studio/rooms.js\|studio/museum/museum.js" studio2 --exclude='*.md'
