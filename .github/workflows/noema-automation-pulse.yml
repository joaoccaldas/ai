name: NOEMA Automation Pulse

on:
  workflow_dispatch:
  push:
    branches: [main, noema/v1.0-religion-decomposition]
    paths:
      - 'projects/noema/data/runs/**'
      - 'projects/noema/data/automation-registry-v2.json'
      - 'projects/noema/scripts/build_automation_pulse.py'
      - 'projects/noema/src/noema/automation_pulse.py'
      - 'projects/noema/src/noema/epistemic_stage.py'
      - '.github/workflows/noema-automation-pulse.yml'

permissions:
  contents: write

concurrency:
  group: noema-automation-pulse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build machine-readable automation pulse
        run: python projects/noema/scripts/build_automation_pulse.py
      - name: Validate observability semantics and registry authority
        run: |
          python - <<'PY'
          import json
          d=json.load(open('projects/noema/site/automation-pulse.json'))
          assert d['report_id']=='NOEMA-AUTOMATION-PULSE-V1'
          assert d['registry_id']=='NOEMA-AUTOMATION-REGISTRY-V2'
          assert d['registry_version']=='2.0.0'
          assert d['status']=='OBSERVABILITY_ONLY' and d['principle'].startswith('Automation output')
          health=d.get('task_health',[])
          required={'GITHUB_DISCOVERY','PUBMED_DISCOVERY','DAILY_INGEST','DPLACE_BENCHMARK','RELIGION_FEDERATION','WEEKLY_REANALYSIS','MONTHLY_DISCOVERY','MEDIA_DISCOVERY','MUSEUM_MEDIA_DISCOVERY'}
          assert {x['task_type'] for x in health} >= required
          for item in health:
              assert item.get('authority')
              assert 'authority_epistemic_ceiling' in item
              assert 'run_reported_epistemic_stage' in item
          for r in d.get('recent_runs',[]):
              g=r.get('epistemic_guards',{})
              assert g.get('model_output_is_evidence') is False and g.get('unknown_is_absent') is False
              assert g.get('similarity_implies_descent') is False and g.get('automatic_claim_promotion') is False
          print('validated',len(d.get('recent_runs',[])),'run manifests and',len(health),'registry tasks')
          PY
      - name: Commit pulse when changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- projects/noema/site/automation-pulse.json)" ]; then echo "Automation pulse unchanged."; exit 0; fi
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/noema/site/automation-pulse.json
          git commit -m "ops(noema): refresh automation pulse [skip noema-pulse]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push race on attempt ${attempt}; retrying"; sleep $((attempt*2))
          done
          exit 1
