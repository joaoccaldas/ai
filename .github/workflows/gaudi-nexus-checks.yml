name: Gaudi Nexus Checks

on:
  push:
    branches: [gaudi-nexus]
    paths:
      - 'projects/gaudi-nexus/**'
      - '.github/workflows/gaudi-nexus-checks.yml'
  pull_request:
    paths:
      - 'projects/gaudi-nexus/**'
      - '.github/workflows/gaudi-nexus-checks.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/gaudi-nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project contract
        run: python scripts/validate_project.py
      - name: Regenerate M0 outputs
        run: python scripts/generate_site_truth.py
      - name: Validate M0 traceability
        run: python scripts/check_m0.py
      - name: Visual evidence registry
        run: python scripts/visual_evidence_gate.py
      - name: Final-10 control plane
        run: python scripts/check_final10.py
      - name: Structural sensitivity evidence
        run: python scripts/structural_thrust_v1.py
      - name: Barcelona solar baseline evidence
        run: python scripts/barcelona_solar_baseline_v1.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Determinism check
        run: git diff --exit-code -- output/m0/cerda_block_template.geojson output/m0/cerda_block_template.svg output/m0/site_truth_report.json output/final10/structural_thrust_v1.json output/final10/barcelona_solar_baseline_v1.json
