name: Gaudi Authoritative Hero Sweep

on:
  push:
    branches: [gaudi-winning-pass-20261007]
    paths:
      - '.github/workflows/gaudi-hero-sweep.yml'
      - 'projects/gaudi-nexus/scripts/render_authoritative_hero_sweep.py'
      - 'projects/gaudi-nexus/scripts/build_rev18_site_truth_candidate.py'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download Blender 5.2
        run: |
          curl -fsSL 'https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz' -o blender.tar.xz
          tar -xf blender.tar.xz
          echo "$PWD/blender-5.2.0-linux-x64" >> "$GITHUB_PATH"

      - name: Install headless render runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 imagemagick

      - name: Download checksum-pinned inputs
        run: |
          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_31Vx2ThP2hxeA9WUkkpCfbJLaeb/57590020-3bff-4a29-89c7-9bdf05a130c6.blend' -o rev15.blend
          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_31Vx2ThP2hxeA9WUkkpCfbJLaeb/eaef5ac9-3706-45dc-809e-73c0b8b4c864.glb' -o municipal.glb
          echo 'cc1179cd2c2b379f954cbc55eb995f88d0786e08b37abfaca7e71417c4b1d494  rev15.blend' | sha256sum -c -
          echo 'f5c324141f1328666c528810b8212c3152f2b6970bd780c6bb4516ee8c3e3f1c  municipal.glb' | sha256sum -c -

      - name: Rebuild Rev18
        run: |
          blender --background rev15.blend --python projects/gaudi-nexus/scripts/build_rev18_site_truth_candidate.py
          test -s rev18_site_truth_candidate.blend

      - name: Render camera sweep
        run: |
          blender --background rev18_site_truth_candidate.blend --python projects/gaudi-nexus/scripts/render_authoritative_hero_sweep.py
          test -s hero_sweep_receipt.json
          ls hero_sweep_C*.png | wc -l | grep -q '^12$'

      - name: Build contact sheet
        run: |
          montage hero_sweep_C*.png -tile 4x3 -geometry 480x270+4+4 hero_sweep_contact_sheet.png
          test -s hero_sweep_contact_sheet.png
          sha256sum hero_sweep_C*.png hero_sweep_contact_sheet.png hero_sweep_receipt.json > hero_sweep_sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gaudi-authoritative-hero-sweep
          path: |
            hero_sweep_C*.png
            hero_sweep_contact_sheet.png
            hero_sweep_receipt.json
            hero_sweep_sha256.txt
          retention-days: 30
