[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "noema-research"
version = "0.1.0"
description = "Provenance-first research engine for cross-cultural belief, ritual, and deep-time hypothesis analysis"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
