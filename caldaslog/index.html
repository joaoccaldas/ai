<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CaldasLog — One calm place for family life</title>
<meta name="description" content="CaldasLog is a privacy-first family operations hub for Swedish parents." />
<meta name="theme-color" content="#080b18" />
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070915;color:#f6f3ea;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}.boot{text-align:center;padding:24px}.orb{width:74px;height:74px;margin:0 auto 20px;border-radius:50%;border:1px solid rgba(102,230,218,.3);background:radial-gradient(circle at 35% 30%,#fff 0 2%,#66e6da 5%,rgba(102,230,218,.12) 40%,transparent 70%);box-shadow:0 0 44px rgba(102,230,218,.24);animation:spin 2.4s linear infinite}.boot p{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.62}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="boot"><div class="orb"></div><p id="boot-status">Assembling the family signal</p></div>
<script>
(async()=>{
  try{
    const files=['00','01','02','03','04'].map(n=>`_page/page.${n}.b64`);
    const responses=await Promise.all(files.map(path=>fetch(path,{cache:'no-store'})));
    if(responses.some(r=>!r.ok)) throw new Error('A page fragment could not be loaded.');
    const parts=await Promise.all(responses.map(r=>r.text()));
    const encoded=parts.map(part=>part.trim()).join('');
    const binary=atob(encoded);
    const bytes=Uint8Array.from(binary,char=>char.charCodeAt(0));
    const html=new TextDecoder('utf-8').decode(bytes);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.getElementById('boot-status').textContent='CaldasLog could not load. Refresh to retry.';
  }
})();
</script>
</body>
</html>
